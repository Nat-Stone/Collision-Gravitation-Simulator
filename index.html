<!DOCTYPE html>

                margin: 0;
                padding: 0;
            }
            
            canvas {
                display: inline-block;
                float: left;
            }
            
            #scroll {
              position: absolute;
              left: 80%;
              overflow: scroll;
              max-height: 100%;
            }
        </style>
        
        <canvas id="main"></canvas>
        <div id="scroll">
          <canvas id="menu"></canvas>
        </div>
        
        <!--
        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
        <p id="p4"></p>
        <p id="p5"></p>
        -->
        <script>
          
/*
notes:
this version has all instances of "*****" replaced with "but" + "t"
*/
const widthFactor = 0.8;

const main = document.getElementById("main");
const ctxMain = main.getContext("2d");

const menu = document.getElementById("menu");
const ctxMenu = menu.getContext("2d");

var pWidth;
var pHeight;
var gameWidth;;
var scaleFactor;

const eps = 10 ** -6;

var gameHeight = 10;
var screenX = 0;
var screenY = 0;
var fps = 60;
var upf = 20
var speed = 1;
const dragVTime = 1 / 10;
const minDrag = 2;
const listWallInc = 0.01;
var mainPTime = 0;
var rawMaindt = 0;
var maindt = 0;
var distOffsetX = 0;
var distOffsetY = 0;

var paused = false;
var gameTime = 0;
var endTime = -1;
var clientX = null;
var clientY = null;
var mouseX = null;
var mouseY = null;
var pmouseX = null;
var pmouseY = null;
var pfmouseX = null;
var pfmouseY = null;
var mouseDownX = null;
var mouseDownY = null;
var newX1 = null;
var newY1 = null;
var newX2 = null;
var newY2 = null;
var newA = null;
var dragType = "b";
var dragMode = undefined;
var dragObj = null;
var dragOffsetX = 0;
var dragOffsetY = 0;
var dragOffsetA = 0;
var dragvx = [];
var dragvy = [];
var dragva = [];
var pColorTime = 0;
var newColor = randColor();
var pressedKeys = [];

var walls = [];
var balls = [];
var G = 0;
var gx = 0;
var gy = 0;
var bRestCoef = 0.99;
var bFrictCoef = 0.2;
var windVX = 0;
var windVY = 0;
var collide = true;
var density = 1;
var moiCoef = 1/2;
var wRestCoef = 0.99;
var wFrictCoef = 0.2;
var dragCoef0 = 0;
var dragCoef1 = 0;
var dragCoef2 = 0;
var distInc = 1/2;
var angInc = 15;
var push = true;
var bounded = false;
var inValue = false;
var menuObjHovered = false;

var menuType = "main";
var menuValues = {};

function updateView() {
  if (window.innerWidth != pWidth || window.innerHeight != pHeight) {
    main.width = window.innerWidth * widthFactor;
    main.height = window.innerHeight;
    
    menu.width = window.innerWidth * (1 - widthFactor);
    menu.height = window.innerHeight;
    menu.left = window.innerHeight * widthFactor;
    
    gameWidth = gameHeight * main.width / main.height;
    scaleFactor = main.height / gameHeight;
    
    pWidth = window.innerWidth;
    pHeight = window.innerHeight;
  }
}

function scale() {
  ctxMain.resetTransform();
  ctxMain.scale(scaleFactor, -scaleFactor);
  ctxMain.translate(- screenX, - gameHeight - screenY);
}

function getMouseX(x) {
  return x / scaleFactor + screenX;
}

function getMouseY(y) {
  return gameHeight - y / scaleFactor + screenY;
}

function shift(dx, dy) {
  let dx1 = Math.round((screenX + distOffsetX + dx) / distInc) * distInc;
  let dy1 = Math.round((screenY + distOffsetY + dy) / distInc) * distInc;
  distOffsetX += dx - dx1;
  distOffsetY += dy - dy1;
  mouseX -= dx;
  mouseY -= dy;
  pmouseX -= dx;
  pmouseY -= dy;
  pfmouseX -= dx;
  pfmouseY -= dy;
  mouseDownX -= dx;
  mouseDownY -= dy;
  for (let b of balls) {
    b.move(-dx, -dy);
  }
  for (let w of walls) {
    w.move(-dx, -dy);
  }
  if (newX1 != null) {
    if (dragType == "l") {
      for (let n = 0; n < newX1.length; n++) {
        newX1[n] -= dx;
        newY1[n] -= dy;
      }
    } else {
      newX1 -= dx;
      newY1 -= dy;
    }
  }
  if (newX2 != null) {
    newX2 -= dx;
    newY2 -= dy;
  }
}

function zoom(factor, x, y) {
  if (x == undefined) {
    x = screenX + gameWidth / 2;
  }
  if (y == undefined) {
    y = screenY + gameHeight / 2;
  }
  scaleFactor /= factor;
  gameWidth *= factor;
  gameHeight *= factor;
  shift((screenX - x) * (factor - 1), (screenY - y) * (factor - 1));
}

function setMenuHeight() {
  let num = getMenuValues().length + (dragObj == null ? 0 : 2);
  menuHeight = Math.max(window.innerHeight, menu.width * (14 * num + 4) / 40);
  if (menu.innerHeight != menuHeight) {
    menu.height = menuHeight;
  }
}

function getMenuValues() {
  return menuValues[menuType];
}

function dist(x1, y1, x2, y2) {
    return Math.sqrt((x2-x1) * (x2-x1) + (y2-y1) * (y2-y1));
}

function sqdist(x1, y1, x2, y2) {
    return (x2-x1) * (x2-x1) + (y2-y1) * (y2-y1);
}

function angle(x1, y1, x2, y2) {
    return Math.atan2(y2 - y1, x2 - x1);
}

function randColor() {
    return "rgb(" + (256 * Math.random()) + ", " + (256 * Math.random()) + ", " + (256 * Math.random()) + ")"
}

function angMod(a) {
    if (a > 0) {
        return a % (Math.PI * 2);
    } else {
        return a % (Math.PI * 2) + Math.PI * 2;
    }
}

function angMod2(a) {
    if (a > 0) {
        return a % (Math.PI * 4);
    } else {
        return a % (Math.PI * 4) + Math.PI * 4;
    }
}

function alignNum(n, align = true) {
  return (align && pressedKeys.includes("shift") ? Math.round(n / distInc) * distInc : n);
}

function alignX(x, align = true) {
  return alignNum(screenX + distOffsetX + x, align) - screenX - distOffsetX;
}

function alignY(y, align = true) {
  return alignNum(screenY + distOffsetY + y, align) - screenY - distOffsetY;
}

function alignPos(x, y, align = true) {
  return [alignX(x, align), alignY(y, align)];
}

function alignAngle(a, align = true) {
  return (align && pressedKeys.includes("control") ? Math.round(a * 180 / angInc / Math.PI) * Math.PI * angInc / 180 : a);
}

function alignDist(x1, y1, x2, y2, align = true) {
  let r = alignNum(dist(x1, y1, x2, y2), align);
  let a = alignAngle(angle(x1, y1, x2, y2), align);
  return [x1 + r * Math.cos(a), y1 + r * Math.sin(a)];
}

function alignLine(x1, y1, x2, y2, align = true) {
  let r = dist(x1, y1, x2, y2);
  let a = alignAngle(angle(x1, y1, x2, y2), !pressedKeys.includes("shift") && align);
  return alignPos(x1 + r * Math.cos(a), y1 + r * Math.sin(a), align);
}

function sum(arr) {
  let total = 0;
  for (n of arr) {
    if (!isNaN(n)) {
      total += n;
    }
  }
  return total;
}

function average(arr) {
  let num = 0;
  let total = 0;
  for (n of arr) {
    if (!isNaN(n)) {
      num += 1;
      total += n;
    }
  }
  if (num > 0) {
      return total / num;
  } else {
      return null;
  }
}

function truncate(num) {
  if (num == 0) {
    return 0;
  }
  let zeros = Math.floor(Math.log10(Math.abs(num)))
  return Math.round(num / 10 ** (zeros - 2)) / 100 + "e" + (zeros > 0 ? "+" : "") + zeros;
}

function stringifyColor(color) {
  if (color.includes(",")) {
    color.replace(" ", "");
    let text = "";
    for (let c of color.substring(4, color.length - 1).split(",")) {
      text += "," + Math.round(c);
    }
    return text.substring(1);
  } else {
    return color;
  }
}

function formatColor(color) {
  if (color.includes(",")) {
    return "rgb(" + color.replace(" ", "") + ")";
  } else {
    return color;
  }
}

function drawBall(px, py, pa, size, color, ctx = ctxMain) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  ctx.translate(px, py);
  ctx.scale(size / 100, size / 100);
  ctx.rotate(pa);
  ctx.fillStyle = color;
  
  ctx.beginPath();
  ctx.arc(0, 0, 50, 0, 2 * Math.PI);
  ctx.fill();
  ctx.lineWidth = 7.5;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#0000007f";
  ctx.beginPath();
  let sqrt3 = 15 * Math.sqrt(3);
  ctx.moveTo(0, 0);
  ctx.lineTo(30, 0);
  ctx.moveTo(0, 0);
  ctx.lineTo(-15, sqrt3);
  ctx.moveTo(0, 0);
  ctx.lineTo(-15, -sqrt3);
  ctx.stroke();
}

function drawRectWall(x1, y1, x2, y2, size, color, ctx = ctxMain) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  ctx.translate(x1, y1);
  ctx.rotate(angle(x1, y1, x2, y2));
  ctx.scale(dist(x1, y1, x2, y2) / 100, size / 100);
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 100, 100);
}

function drawTriWall(x, y, color, ctx = ctxMain) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x[0], y[0]);
  for (let n = 1; n < x.length; n++) {
    ctx.lineTo(x[n], y[n]);
  }
  ctx.fill();
}

function drawCircleWall(x, y, r1, r2, a1, a2, color, ctx = ctxMain) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r1, a1, a2, angMod2(a2 - a1) >= Math.PI * 2);
  ctx.arc(x, y, r2, a2, a1, angMod2(a2 - a1) < Math.PI * 2);
  ctx.fill();
  
  //ctx.strokeStyle = color;
  //ctx.lineWidth = Math.abs(r2 - r1);
  //ctx.lineCap = "but" + "t";
  //ctx.strokeStyle = color;
  //ctx.lineWidth = Math.abs(r2 - r1);
  //ctx.lineCap = "but" + "t";
  //ctx.beginPath();
  //ctx.arc(x, y, (r1 + r2) / 2, a1, a2);
  //ctx.stroke();
}

function drawListWall(wList, ctx = ctxMain) {
  
  if (wList.length > 0) {
    if (ctx == ctxMain) {
      scale();
    } else {
      ctx.resetTransform();
    }
    ctx.fillStyle = wList[0].color;
    
    let w;
    let pw = wList[0];
    for (let n = 1; n < wList.length; n++) {
      w = wList[n];
      
      ctx.beginPath();
      ctx.moveTo(pw.x[1], pw.y[1]);
      ctx.lineTo(pw.x[0], pw.y[0]);
      ctx.lineTo(pw.x[2], pw.y[2]);
      ctx.lineTo(w.x[2], w.y[2]);
      
      ctx.fill();
      
      pw = w;
    }
  }
  
}

function Ball(px, py, pa, vx, vy, va, mass, size, moiCoef, drag0, drag1, drag2, color) {
  this.px = px;
  this.py = py;
  this.pa = pa;
  this.vx = vx;
  this.vy = vy;
  this.va = va;
  this.mass = mass;
  this.size = size;
  this.moiCoef = moiCoef;
  this.drag0 = drag0;
  this.drag1 = drag1;
  this.drag2 = drag2;
  this.color = color;
  
  this.collided = [];
  this.ax = 0;
  this.ay = 0;
  this.aa = 0;
  
  this.show = function() {
      drawBall(this.px, this.py, this.pa, this.size, this.color);
  }
  
  this.move = function(dx, dy) {
    this.px += dx;
    this.py += dy;
  }
  
  this.update1 = function(dt) {
    //acceleration
    this.accelerate();
  } //acceleration
  
  this.update2 = function(dt) {
    //move
    this.px += this.vx * dt + this.ax * dt * dt / 2;
    this.py += this.vy * dt + this.ay * dt * dt / 2;
    this.pa += this.va * dt + this.aa * dt * dt / 2;
    //accelerate
    this.vx += this.ax * dt;
    this.vy += this.ay * dt;
    this.va += this.aa * dt;
    this.drag(dt);
    //previous
    this.pvx = this.vx;
    this.pvy = this.vy;
    this.pva = this.va;
    //new
    this.collided = [];
    this.dpx = [];
    this.dpy = [];
    this.dpa = [];
    this.dvx = [];
    this.dvy = [];
    this.dva = [];
    this.bounceTotal = 0;
    this.bounceNormalX = 0;
    this.bounceNormalY = 0;
    this.bounceRest = 0;
    this.bounceFrict = 0;
  } //movement
  
  this.update3 = function(dt) {
      //balls
      if (collide) {
        for (b of balls) {
          if (b != this && (b != dragObj || dragMode == undefined) && !this.collided.includes(b)) {
            this.collideBall(b);
          }
        }
      }
      //walls
      for (w of walls) {
        if (w != dragObj || dragMode == undefined) {
          this.collideWall(w);
        }
      }
  } //collisions
  
  this.update4 = function(dt) {
    if (this.bounceTotal != 0) {
      let normalMag = Math.sqrt(this.bounceNormalX * this.bounceNormalX + this.bounceNormalY * this.bounceNormalY);
      normalMag = (normalMag == 0 ? 1 : normalMag);
      this.bounceNormalX /= normalMag;
      this.bounceNormalY /= normalMag;
      this.bounceRest /= this.bounceTotal;
      this.bounceFrict /= this.bounceTotal;
    }
    let pvx = this.vx;
    let pvy = this.vy;
    let pva = this.va;
    let ppx = this.px;
    let ppy = this.py;
    let ppa = this.pa;
    if (push) {
      let newN;
      newN = average(this.dpx);
      if (newN != null) {
        this.px += newN;
      }
      newN = average(this.dpy);
      if (newN != null) {
        this.py += newN;
      }
      newN = average(this.dpa);
      if (newN != null) {
        this.pa += newN;
      }
    }
    //boundaries
    if (bounded) {
      let fVal = 0;
      let fMax = 0;
      if (this.px < this.size / 2) {
          this.px = this.size / 2;
          if (this.vx < 0) {
              fMax = - (1 + wRestCoef) * this.vx * wFrictCoef;
              fVal = (this.vy - this.va * this.size / 2) / (1 + 1 / this.moiCoef);
              if (fMax < Math.abs(fVal)) {
                  fVal = fMax * Math.sign(fVal);
              }
              this.vx *= -wRestCoef;
              this.vy -= fVal;
              this.va += 2 * fVal / this.size / this.moiCoef;
          }
      }
      if (this.px > gameWidth - this.size / 2) {
          this.px = gameWidth - this.size / 2;
          if (this.vx > 0) {
              fMax = (1 + wRestCoef) * this.vx * wFrictCoef;
              fVal = (this.vy + this.va * this.size / 2) / (1 + 1 / this.moiCoef);
              if (fMax < Math.abs(fVal)) {
                  fVal = fMax * Math.sign(fVal);
              }
              this.vx *= -wRestCoef;
              this.vy -= fVal;
              this.va -= 2 * fVal / this.size / this.moiCoef;
          }
      }
      if (this.py < this.size / 2) {
          this.py = this.size / 2;
          if (this.vy < 0) {
              fMax = - (1 + wRestCoef) * this.vy * wFrictCoef;
              fVal = (this.vx + this.va * this.size / 2) / (1 + 1 / this.moiCoef);
              if (fMax < Math.abs(fVal)) {
                  fVal = fMax * Math.sign(fVal);
              }
              this.vy *= -wRestCoef;
              this.vx -= fVal;
              this.va -= 2 * fVal / this.size / this.moiCoef;
          }
      }
      if (this.py > gameHeight - this.size / 2) {
          this.py = gameHeight - this.size / 2;
          if (this.vy > 0) {
              fMax = (1 + wRestCoef) * this.vy * wFrictCoef;
              fVal = (this.vx - this.va * this.size / 2) / (1 + 1 / this.moiCoef);
              if (fMax < Math.abs(fVal)) {
                  fVal = fMax * Math.sign(fVal);
              }
              this.vy *= -wRestCoef;
              this.vx -= fVal;
              this.va += 2 * fVal / this.size / this.moiCoef;
          }
      }
    }
    //potential
    if (ppx != this.px || ppy != this.py) {
      let pe = - gx * ppx - gy * ppy;
      let e = - gx * this.px - gy * this.py;
      if (G != 0) {
        for (b of balls) {
          if (this != b) {
            pe -= G * b.mass / dist(ppx, ppy, b.px, b.py);
            e -= G * b.mass / dist(this.px, this.py, b.px, b.py);
          }
        }
      }
      if (pe != e) {
        let ax = this.px - ppx;
        let ay = this.py - ppy;
        let a = ax * ax + ay * ay;
        let vDota = this.vx * ax + this.vy * ay;
        let t = ((vDota >= 0 ? 1 : -1) * Math.sqrt(Math.max(vDota * vDota + 2 * a * (pe - e), 0)) - vDota) / a;
        this.vx += ax * t;
        this.vy += ay * t;
      }
    }
    //set
    this.nvx = this.vx;
    this.nvy = this.vy;
    this.nva = this.va;
    this.npx = this.px;
    this.npy = this.py;
    this.npa = this.pa;
    this.vx = pvx;
    this.vy = pvy;
    this.va = pva;
    this.px = ppx;
    this.py = ppy;
    this.pa = ppa;
  } //calculate positions
  
  this.update5 = function(dt) {
    if (push) {
      this.px = this.npx;
      this.py = this.npy;
      this.pa = this.npa;
    }
    this.vx = this.nvx;
    this.vy = this.nvy;
    this.va = this.nva;
  } //apply positions
  
  this.update6 = function(dt) {
    //balls
    for (let b of this.collided) {
      this.bounceBall(b);
    }
    //walls
    if (this.bounceTotal != 0) {
      this.bounceWall(this.bounceNormalX, this.bounceNormalY, this.bounceRest, this.bounceFrict);
    }
  } //calculate velocities
  
  this.update7 = function(dt) {
    //apply
    this.vx += sum(this.dvx);
    this.vy += sum(this.dvy);
    this.va += sum(this.dva);
    //reset
    this.collided = [];
    this.ax = 0;
    this.ay = 0;
    this.aa = 0;
  } //apply velocities
  
  this.accelerate = function() {
    //uniform gravity
    this.ax += gx;
    this.ay += gy;
    //object gravity
    if (G != 0) {
      for (b of balls) {
        if (b != this && (b != dragObj || dragMode == undefined) && !this.collided.includes(b)) {
          this.forceBall(b);
        }
      }
    }
  }
  
  this.drag = function(dt) {
    let rvx = this.vx - windVX;
    let rvy = this.vy - windVY;
    if ((rvx != 0 || rvy != 0) && (this.drag0 != 0 || this.drag1 != 0 || this.drag2 != 0)) {
      let vx = rvx + this.ax * dt;
      let vy = rvy + this.ay * dt;
      let vel = Math.sqrt(vx * vx + vy * vy);
      let mag = (this.drag0 / vel + this.drag1 + this.drag2 * vel) * dt / this.mass;
      if (mag < 1) {
        this.vx -= mag * vx;
        this.vy -= mag * vy;
      } else {
        this.vx = 0;
        this.vy = 0;
      }
    }
  }
  
  this.forceBall = function(b) {
    let distance = dist(this.px, this.py, b.px, b.py);
    let mag = G / distance ** 3;
    this.ax += mag * b.mass * (b.px - this.px);
    this.ay += mag * b.mass * (b.py - this.py);
    b.ax += mag * this.mass * (this.px - b.px);
    b.ay += mag * this.mass * (this.py - b.py);
    b.collided.push(this);
  } //ball-ball gravity
  
  this.addBounce = function(normalX, normalY, rest, frict, normalV) {
    let mag;
    if (normalV == undefined) {
      mag = this.vx * normalX + this.vy * normalY;
    } else {
      mag = normalV;
    }
    if (mag <= eps * Math.sqrt(this.vx * this.vx + this.vy * this.vy)) {
      mag = Math.abs(mag);
      this.bounceTotal += mag;
      this.bounceNormalX += normalX * mag;
      this.bounceNormalY += normalY * mag;
      this.bounceRest += rest * mag;
      this.bounceFrict += frict * mag;
    }
  }
  
  this.bounceBall = function(b) {
    let pvDotp = (this.pvx - b.pvx) * (b.px - this.px) + (this.pvy - b.pvy) * (b.py - this.py);
    if (pvDotp >= -eps * Math.sqrt(this.vx * this.vx + this.vy * this.vy)) {
      let totalMass = this.mass + b.mass;
      let this_mass = (totalMass == 0 ? 1 : this.mass);
      let b_mass = (totalMass == 0 ? 1 : b.mass);
      totalMass = (totalMass == 0 ? 2 : totalMass);
      let distance = dist(this.px, this.py, b.px, b.py);
      let vDotp = (this.vx - b.vx) * (b.px - this.px) + (this.vy - b.vy) * (b.py - this.py);
      let normalVelMag = vDotp * (1 + bRestCoef) / distance / totalMass;
      let normalVelAng = normalVelMag / distance;
      let normalVelX = normalVelAng * (b.px - this.px);
      let normalVelY = normalVelAng * (b.py - this.py);
      let force = Math.abs(pvDotp + vDotp * bRestCoef) / distance / totalMass;
      let vDotSide = ((this.vx - b.vx) * (this.py - b.py) + (this.vy - b.vy) * (b.px - this.px)) / distance;
      let sideVel = vDotSide + (this.va * this.size + b.va * b.size) / 2;
      let sideVelAng = sideVel / distance;
      let sideVelX = sideVelAng * (this.py - b.py);
      let sideVelY = sideVelAng * (b.px - this.px);
      let frictionVelMag = Math.sign(sideVel) * Math.min(Math.abs(sideVel) / (1 + 1 / this.moiCoef) / totalMass, Math.abs(bFrictCoef * force));
      let frictionVelAng = frictionVelMag / (sideVel == 0 ? Math.SQRT2 : sideVel);
      let frictionVelX = frictionVelAng * (sideVel == 0 ? 1 : sideVelX);
      let frictionVelY = frictionVelAng * (sideVel == 0 ? 1 : sideVelY);
      
      this.dvx.push(-b_mass * (normalVelX + frictionVelX));
      b.dvx.push(this_mass * (normalVelX + frictionVelX));
      this.dvy.push(-b_mass * (normalVelY + frictionVelY));
      b.dvy.push(this_mass * (normalVelY + frictionVelY));
      this.dva.push(-b_mass * 2 * frictionVelMag / this.size / this.moiCoef);
      b.dva.push(-this_mass * 2 * frictionVelMag / b.size / b.moiCoef);
    }
  }
  
  this.bounceWall = function(normalX, normalY, rest, sFrict) {
    let pNormalV = this.pvx * normalX + this.pvy * normalY;
    let normalV = this.vx * normalX + this.vy * normalY;
    let force = Math.abs(pNormalV + normalV * rest);
    let sideV = this.vx * normalY - this.vy * normalX;
    let fMax = force * (Math.abs(sideV + this.pva * this.size / 2) <= Math.abs(sideV) * eps ? sFrict : sFrict * 1);
    let fVal = (sideV + this.va * this.size / 2) / (1 + 1 / this.moiCoef);
    if (fMax < Math.abs(fVal)) {
      fVal = fMax * Math.sign(fVal);
    }
    this.dvx.push(-(1 + rest) * normalV * normalX - fVal * normalY);
    this.dvy.push(-(1 + rest) * normalV * normalY + fVal * normalX);
    this.dva.push(-2 * fVal / this.size / this.moiCoef);
    
    let vx = this.vx;
    let vy = this.vy;
    let va = this.va;
    this.vx += this.dvx.at(-1);
    this.vy += this.dvy.at(-1);
    this.va += this.dva.at(-1);
    this.vx = vx;
    this.vy = vy;
    this.va = va;
  }
  
  this.collideBall = function(b) {
    let sqDistance = sqdist(this.px, this.py, b.px, b.py);
    if ((this.size + b.size) * (this.size + b.size) > 4 * sqDistance) {
      let totalMass = this.mass + b.mass;
      let this_mass = (totalMass == 0 ? 1 : this.mass);
      let b_mass = (totalMass == 0 ? 1 : b.mass);
      totalMass = (totalMass == 0 ? 2 : totalMass);
      let curDist = Math.sqrt(sqDistance);
      let targetDist = /*(1 + eps) * */(this.size + b.size) / 2;
      let pushFactor = (targetDist - curDist) / curDist * b_mass / totalMass;
      let bPushFactor = (targetDist - curDist) / curDist * this_mass / totalMass;
      this.dpx.push(-(b.px - this.px) * pushFactor);
      this.dpy.push(-(b.py - this.py) * pushFactor);
      b.dpx.push(-(this.px - b.px) * bPushFactor);
      b.dpy.push(-(this.py - b.py) * bPushFactor);
      
      b.collided.push(this);
    }
  }
  
  this.collideWall = function(w) {
      switch (w.wallType) {
          case "rect":
              this.collideRectWall(w);
              break;
          case "tri":
              this.collideTriWall(w);
              break;
          case "circle":
              this.collideCircleWall(w);
              break;
          case "list":
              for (w1 of w.walls) {
                  this.collideWall(w1);
              }
              break;
      }
  }
  
  this.collideRectWall = function(w) {
      
      let dist1 = (this.px - w.centerX) * w.normalX1 + (this.py - w.centerY) * w.normalY1;
      let dist2 = (this.px - w.centerX) * w.normalX2 + (this.py - w.centerY) * w.normalY2;
      let edgeDist1 = 2 * Math.abs(dist1) - w.size1;
      let edgeDist2 = 2 * Math.abs(dist2) - w.size2;
      let effSize1 = (edgeDist2 > 0 && edgeDist2 < this.size ? Math.sqrt(this.size * this.size - edgeDist2 * edgeDist2) : this.size);
      let effSize2 = (edgeDist1 > 0 && edgeDist1 < this.size ? Math.sqrt(this.size * this.size - edgeDist1 * edgeDist1) : this.size);
      if (edgeDist1 <= effSize1 && edgeDist2 <= effSize2) {
          let v1 = this.vx * w.normalX1 + this.vy * w.normalY1;
          let v2 = this.vx * w.normalX2 + this.vy * w.normalY2;
          let pxCol;
          let pyCol;
          if (effSize1 - edgeDist1 <= effSize2 - edgeDist2) {
              let pushDist = /*(1 + eps) * */((effSize1 + w.size1) / 2 - Math.abs(dist1)) * Math.sign(dist1);
              pxCol = pushDist * w.normalX1;
              pyCol = pushDist * w.normalY1;
              this.dpx.push(pxCol);
              this.dpy.push(pyCol);
              pxCol += this.px;
              pyCol += this.py;
          } else {
              let pushDist = ((effSize2 + w.size2) / 2 - Math.abs(dist2)) * Math.sign(dist2);
              pxCol = pushDist * w.normalX2;
              pyCol = pushDist * w.normalY2;
              this.dpx.push(pxCol);
              this.dpy.push(pyCol);
              pxCol += this.px;
              pyCol += this.py;
          }
          dist1 = (pxCol - w.centerX) * w.normalX1 + (pyCol - w.centerY) * w.normalY1;
          dist2 = (pxCol - w.centerX) * w.normalX2 + (pyCol - w.centerY) * w.normalY2;
          if (2 * Math.abs(dist2) < w.size2) {
            this.addBounce(w.normalX1 * Math.sign(dist1), w.normalY1 * Math.sign(dist1), w.wRest, w.wFrict, v1 * Math.sign(dist1));
          } else if (2 * Math.abs(dist1) < w.size1) {
            this.addBounce(w.normalX2 * Math.sign(dist2), w.normalY2 * Math.sign(dist2), w.wRest, w.wFrict, v2 * Math.sign(dist2));
          } else {
            let edgeDist1 = dist1 - Math.sign(dist1) * w.size1 / 2;
            let edgeDist2 = dist2 - Math.sign(dist2) * w.size2 / 2;
            let distance = Math.sqrt(edgeDist1 * edgeDist1 + edgeDist2 * edgeDist2);
            let normalX = (edgeDist1 * w.normalX1 + edgeDist2 * w.normalX2) / distance;
            let normalY = (edgeDist1 * w.normalY1 + edgeDist2 * w.normalY2) / distance;
            this.addBounce(normalX, normalY, w.wRest, w.wFrict);
          }
      }
      
  }
  
  this.collideTriWall = function(w) {
      
      let sideDist = [];
      let normalDist = [];
      let sides = false;
      let inWall = true;
      for (let n = 0; n < w.num; n++) {
        sideDist.push(Math.abs((this.px - w.midX[n]) * w.sideX[n] + (this.py - w.midY[n]) * w.sideY[n]));
        normalDist.push((this.px - w.x[n]) * w.normalX[n] + (this.py - w.y[n]) * w.normalY[n]);
        sides = (Math.abs(2 * normalDist[n]) <= this.size && 2 * sideDist[n] <= w.size[n] ? true : sides)
        inWall = (normalDist[n] > 0 ? false : inWall)
      }
      
      let vertex;
      if (!(sides || inWall)) {
        let vertexSqdist;
        let bestSqdist = Number.POSITIVE_INFINITY;
        for (let n = 0; n < w.num; n++) {
          vertexSqdist = sqdist(this.px, this.py, w.x[n], w.y[n])
          if (4 * vertexSqdist <= this.size * this.size && vertexSqdist < bestSqdist) {
            vertex = n;
            bestSqdist = vertexSqdist;
          }
        }
      }
      
      if (sides || inWall || vertex != undefined) {
        let side = 0;
        for (let n = 1; n < w.num; n++) {
          if (normalDist[n] > normalDist[side]) {
            side = n;
          }
        }
        
        let pushDist = /*(1 + eps) * */((vertex == undefined ? this.size : Math.sqrt(this.size * this.size - (2 * sideDist[side] - w.size[side]) ** 2)) / 2 - normalDist[side]);
        let pxCol = pushDist * w.normalX[side];
        let pyCol = pushDist * w.normalY[side];
        this.dpx.push(pxCol);
        this.dpy.push(pyCol);
        pxCol += this.px;
        pyCol += this.py;
        
        let sideX;
        let sideY;
        let normalX;
        let normalY;
        if (vertex == undefined) {
          sideX = w.sideX[side];
          sideY = w.sideY[side];
          normalX = w.normalX[side];
          normalY = w.normalY[side];
        } else {
          let distance = dist(w.x[vertex], w.y[vertex], pxCol, pyCol);
          normalX = (pxCol - w.x[vertex]) / distance;
          normalY = (pyCol - w.y[vertex]) / distance;
          sideX = normalY;
          sideY = -normalX;
        }
        this.addBounce(normalX, normalY, w.wRest, w.wFrict);
      }
      
  }
  
  this.collideCircleWall = function(w) {
      let distance = dist(w.x, w.y, this.px, this.py);
      let dist1 = distance - w.r1 + this.size / 2;
      let dist2 = w.r2 - distance + this.size / 2;
      
      if (dist1 >= 0 && dist2 >= 0) {
        let ang = angle(w.x, w.y, this.px, this.py);
        let distA1 = (this.px - w.x) * w.ax1 + (this.py - w.y) * w.ay1;
        let distA2 = (this.px - w.x) * w.ax2 + (this.py - w.y) * w.ay2;
        let offsetA1 = Math.abs(distA1 * 2 - w.r1 - w.r2) + w.r1 - w.r2;
        let offsetA2 = Math.abs(distA2 * 2 - w.r1 - w.r2) + w.r1 - w.r2;
        let effSize1 = (w.r1 <= distA1 && distA1 <= w.r2 ? this.size / 2 : (offsetA1 < this.size ? Math.sqrt(this.size * this.size - offsetA1 * offsetA1) / 2 : 0));
        let effSize2 = (w.r1 <= distA2 && distA2 <= w.r2 ? this.size / 2 : (offsetA2 < this.size ? Math.sqrt(this.size * this.size - offsetA2 * offsetA2) / 2 : 0));
        let offset1 = (this.px - w.x) * w.normalX1 + (this.py - w.y) * w.normalY1;
        let offset2 = (this.px - w.x) * w.normalX2 + (this.py - w.y) * w.normalY2;
        let angDist1 = angMod(ang - w.a1);
        let angDist2 = angMod(w.a2 - ang);
        let pxCol;
        let pyCol;
        
        if (angMod(w.a2 - w.a2) == 0 || angDist1 + angDist2 <= Math.PI * 2 || Math.abs(offset1) <= effSize1 || Math.abs(offset2) <= effSize2) {
            let v1;
            let v2;
            let fMax;
            let fVal;
            let normalX;
            let normalY;
            let side = false;
            
            switch (Math.min(dist1, dist2, Math.abs(effSize1 - offset1), Math.abs(effSize2 - offset2))) {
                case dist1:
                    side = true;
                case dist2:
                    normalX = (this.px - w.x) / distance * (side ? -1 : 1);
                    normalY = (this.py - w.y) / distance * (side ? -1 : 1);
                    pxCol = (side ? dist1 : dist2) * normalX;
                    pyCol = (side ? dist1 : dist2) * normalY;
                    this.dpx.push(pxCol);
                    this.dpy.push(pyCol);
                    pxCol += this.px;
                    pyCol += this.py;
                    break;
                case Math.abs(effSize1 - offset1):
                    pxCol = Math.abs(effSize1 - offset1) * w.normalX1;
                    pyCol = Math.abs(effSize1 - offset1) * w.normalY1;
                    this.dpx.push(pxCol);
                    this.dpy.push(pyCol);
                    pxCol += this.px;
                    pyCol += this.py;
                    break;
                case Math.abs(effSize2 - offset2):
                    pxCol = Math.abs(effSize2 - offset2) * w.normalX2;
                    pyCol = Math.abs(effSize2 - offset2) * w.normalY2;
                    this.dpx.push(pxCol);
                    this.dpy.push(pyCol);
                    pxCol += this.px;
                    pyCol += this.py;
                    break;
            }
            distance = dist(w.x, w.y, pxCol, pyCol);
            ang = angle(w.x, w.y, pxCol, pyCol);
            offset1 = (pxCol - w.x) * w.normalX1 + (pyCol - w.y) * w.normalY1;
            offset2 = (pxCol - w.x) * w.normalX2 + (pyCol - w.y) * w.normalY2;
            if (distance < w.r1 - this.size / 2 + eps || distance > w.r2 + this.size / 2 - eps) {
              this.addBounce(normalX, normalY, w.wRest, w.wFrict);
            } else if (Math.abs(offset1 * 2 - this.size) <= eps || Math.abs(offset2 * 2 - this.size) <= eps) {
                if (Math.abs(Math.PI - angDist1) >= Math.abs(Math.PI - angDist2)) {
                  this.addBounce(w.normalX1, w.normalY1, w.wRest, w.wFrict);
                } else {
                  this.addBounce(w.normalX2, w.normalY2, w.wRest, w.wFrict);
                }
            } else {
              let r = (2 * distance < w.r1 + w.r2 ? w.r1 : w.r2);
              let ax = (Math.abs(effSize1 - offset1) <= Math.abs(effSize2 - offset2) ? w.ax1 : w.ax2);
              let ay = (Math.abs(effSize1 - offset1) <= Math.abs(effSize2 - offset2) ? w.ay1 : w.ay2);
              let distX = pxCol - w.x - r * ax;
              let distY = pyCol - w.y - r * ay;
              let distMag = Math.sqrt(distX * distX + distY * distY);
              let normalX = distX / distMag;
              let normalY = distY / distMag;
              this.addBounce(normalX, normalY, w.wRest, w.wFrict);
            }
        }
      }
  }
  
  this.containsPoint = function(x, y) {
      return sqdist(this.px, this.py, x, y) * 4 <= this.size * this.size;
  }
  
  this.setMOI = function(moi) {
    this.moi = moi;
    this.moiCoef = 4 * this.moi / this.mass / this.size ** 2;
  }
  
  this.setMOICoef = function(moiCoef) {
    this.moiCoef = moiCoef;
    this.updateMOI();
  }
  
  this.updateMOI = function() {
    this.moi = this.moiCoef * this.mass * this.size ** 2 / 4;
  }
  
  this.setMOICoef(moiCoef);
}

function RectWall(x1, y1, x2, y2, size, wRest, wFrict, color) {
    this.wallType = "rect";
    this.x1 = x1;
    this.y1 = y1;
    this.x2 = x2;
    this.y2 = y2;
    this.size = size;
    this.wRest = wRest;
    this.wFrict = wFrict;
    this.color = color;
    
    this.setDim = function() {
      this.size1 = Math.abs(this.size);
      this.size2 = dist(this.x1, this.y1, this.x2, this.y2);
      this.normalX1 = (this.y1 - this.y2) / this.size2;
      this.normalY1 = (this.x2 - this.x1) / this.size2;
      this.normalX2 = this.normalY1;
      this.normalY2 = -this.normalX1;
      this.centerX = (this.x1 + this.x2 + this.normalX1 * this.size) / 2;
      this.centerY = (this.y1 + this.y2 + this.normalY1 * this.size) / 2;
      this.angle = angle(this.x1, this.y1, this.x2, this.y2);
      
      this.offsetX = 0;
      this.offsetY = 0;
      this.offsetSize = Math.max(Math.abs(this.x2 - this.x1) + Math.abs(this.size1 * this.normalX1), Math.abs(this.y2 - this.y1) + Math.abs(this.size1 * this.normalY1));
    }
    
    this.setDim();
    
    this.show = function() {
        drawRectWall(this.x1, this.y1, this.x2, this.y2, this.size, this.color);
    }
    
    this.containsPoint = function(x, y) {
        let dist1 = (this.centerX - x) * this.normalX1 + (this.centerY - y) * this.normalY1;
        let dist2 = (this.centerX - x) * this.normalX2 + (this.centerY - y) * this.normalY2;
        return Math.abs(dist1) * 2 <= this.size1 && Math.abs(dist2) * 2 <= this.size2;
    }
    
    this.move = function(dx, dy) {
        this.x1 += dx;
        this.y1 += dy;
        this.x2 += dx;
        this.y2 += dy;
        this.centerX += dx;
        this.centerY += dy;
    }
    
    this.rotate = function(da) {
      let dax = Math.cos(da);
      let day = Math.sin(da);
      let normalX1 = this.normalX1 * dax - this.normalY1 * day;
      let normalY1 = this.normalX1 * day + this.normalY1 * dax;
      let normalX2 = normalY1;
      let normalY2 = -normalX1;
      this.normalX1 = normalX1;
      this.normalY1 = normalY1;
      this.normalX2 = normalX2;
      this.normalY2 = normalY2;
      this.x1 = this.centerX - (normalX1 * this.size + normalY1 * this.size2) / 2;
      this.y1 = this.centerY - (normalY1 * this.size - normalX1 * this.size2) / 2;
      this.x2 = this.centerX - (normalX1 * this.size - normalY1 * this.size2) / 2;
      this.y2 = this.centerY - (normalY1 * this.size + normalX1 * this.size2) / 2;
      this.offsetSize = Math.max(Math.abs(this.x2 - this.x1) + Math.abs(this.size1 * this.normalX1), Math.abs(this.y2 - this.y1) + Math.abs(this.size1 * this.normalY1));
      this.angle = angle(this.x1, this.y1, this.x2, this.y2);
    }
}

function TriWall(x, y, wRest, wFrict, color) {
  this.wallType = "tri";
  this.x = x;
  this.y = y;
  this.wRest = wRest;
  this.wFrict = wFrict;
  this.color = color;
  
  this.setDim = function() {
    this.num = x.length;
    this.centerX = average(this.x);
    this.centerY = average(this.y);
    this.angle = angle(this.centerX, this.centerY, this.x[0], this.y[0]);
    
    this.offsetX = (Math.max(...this.x) + Math.min(...this.x)) / 2 - this.centerX;
    this.offsetY = (Math.max(...this.y) + Math.min(...this.y)) / 2 - this.centerY;
    this.offsetSize = Math.max(Math.max(...this.x) - Math.min(...this.x), Math.max(...this.y) - Math.min(...this.y));
    
    this.dir = ((this.x[1] - this.x[0]) * (this.y[2] - this.y[1]) - (this.x[2] - this.x[1]) * (this.y[1] - this.y[0]) > 0 ? 1 : -1);
    this.size = [];
    this.midX = [];
    this.midY = [];
    this.sideX = [];
    this.sideY = [];
    this.normalX = [];
    this.normalY = [];
    for (let n = 0; n < this.num; n++) {
      this.size.push(dist(this.x[n], this.y[n], this.x[(n + 1) % this.num], this.y[(n + 1) % this.num]));
      this.midX.push((this.x[n] + this.x[(n + 1) % this.num]) / 2);
      this.midY.push((this.y[n] + this.y[(n + 1) % this.num]) / 2);
      this.sideX.push(this.dir * (this.x[n] - this.x[(n + 1) % this.num]) / this.size[n]);
      this.sideY.push(this.dir * (this.y[n] - this.y[(n + 1) % this.num]) / this.size[n]);
      this.normalX.push(-this.sideY[n]);
      this.normalY.push(this.sideX[n]);
    }
  }
  
  this.setDim();
  
  this.show = function() {
    drawTriWall(this.x, this.y, this.color);
  }
  
  this.containsPoint = function(x, y) {
    for (let n = 0; n < this.num; n++) {
      if ((x - this.x[n]) * this.normalX[n] + (y - this.y[n]) * this.normalY[n] > 0) {
        return false;
      }
    }
    return true;
  }
  
  this.move = function(dx, dy) {
    for (let n = 0; n < this.num; n++) {
      this.x[n] += dx;
      this.y[n] += dy;
      this.midX[n] += dx;
      this.midY[n] += dy;
    }
    this.centerX += dx;
    this.centerY += dy;
  }
  
  this.rotate = function(da) {
    let dax = Math.cos(da);
    let day = Math.sin(da);
    let newX;
    let newY;
    for (let n = 0; n < this.num; n++) {
      newX = this.sideX[n] * dax - this.sideY[n] * day;
      newY = this.sideX[n] * day + this.sideY[n] * dax;
      this.sideX[n] = newX;
      this.sideY[n] = newY;
      newX = this.normalX[n] * dax - this.normalY[n] * day;
      newY = this.normalX[n] * day + this.normalY[n] * dax;
      this.normalX[n] = newX;
      this.normalY[n] = newY;
    }
    for (let n = 0; n < this.num; n++) {
      newX = (this.x[n] - this.centerX) * dax - (this.y[n] - this.centerY) * day + this.centerX;
      newY = (this.x[n] - this.centerX) * day + (this.y[n] - this.centerY) * dax + this.centerY;
      this.x[n] = newX;
      this.y[n] = newY;
      newX = (this.midX[n] - this.centerX) * dax - (this.midY[n] - this.centerY) * day + this.centerX;
      newY = (this.midX[n] - this.centerX) * day + (this.midY[n] - this.centerY) * dax + this.centerY;
      this.midX[n] = newX;
      this.midY[n] = newY;
    }
    this.angle += da;
    
    this.offsetX = (Math.max(...this.x) + Math.min(...this.x)) / 2 - this.centerX;
    this.offsetY = (Math.max(...this.y) + Math.min(...this.y)) / 2 - this.centerY;
    this.offsetSize = Math.max(Math.max(...this.x) - Math.min(...this.x), Math.max(...this.y) - Math.min(...this.y));
  }
}

function CircleWall(x, y, r1, r2, a1, a2, wRest, wFrict, color) {
    this.wallType = "circle";
    
    this.x = x;
    this.y = y;
    this.radius1 = r1;
    this.radius2 = r2;
    this.angle1 = a1;
    this.angle2 = a2;
    this.wRest = wRest;
    this.wFrict = wFrict;
    this.color = color;
    
    this.setDim = function() {
      this.r1 = Math.min(this.radius1, this.radius2);
      this.r2 = Math.max(this.radius1, this.radius2);
      this.a1 = angMod2(this.angle1);
      this.a2 = angMod2(this.angle2);
      
      this.ax1 = Math.cos(this.a1);
      this.ay1 = Math.sin(this.a1);
      this.ax2 = Math.cos(this.a2);
      this.ay2 = Math.sin(this.a2);
      this.normalX1 = this.ay1;
      this.normalY1 = -this.ax1;
      this.normalX2 = -this.ay2;
      this.normalY2 = this.ax2;
      this.centerX = this.x;
      this.centerY = this.y;
      this.angle = this.a1;
      
      let maxX = (Math.ceil(this.a1 / Math.PI / 2) == Math.floor(this.a2 / Math.PI / 2) ? this.r2 : Math.max(this.r1 * this.ax1, this.r1 * this.ax2, this.r2 * this.ax1, this.r2 * this.ax2));
      let minX = (Math.ceil(this.a1 / Math.PI / 2 - 1 / 2) == Math.floor(this.a2 / Math.PI / 2 - 1 / 2) ? -this.r2 : Math.min(this.r1 * this.ax1, this.r1 * this.ax2, this.r2 * this.ax1, this.r2 * this.ax2));
      let maxY = (Math.ceil(this.a1 / Math.PI / 2 - 1 / 4) == Math.floor(this.a2 / Math.PI / 2 - 1 / 4) ? this.r2 : Math.max(this.r1 * this.ay1, this.r1 * this.ay2, this.r2 * this.ay1, this.r2 * this.ay2));
      let minY = (Math.ceil(this.a1 / Math.PI / 2 - 3 / 4) == Math.floor(this.a2 / Math.PI / 2 - 3 / 4) ? -this.r2 : Math.min(this.r1 * this.ay1, this.r1 * this.ay2, this.r2 * this.ay1, this.r2 * this.ay2));
      this.offsetX = (maxX + minX) / 2;
      this.offsetY = (maxY + minY) / 2;
      this.offsetSize = Math.max(maxX - minX, maxY - minY);
    }
    
    this.setDim();
    
    this.show = function() {
        drawCircleWall(this.x, this.y, this.r1, this.r2, this.a1, this.a2, this.color);
    }
    
    this.containsPoint = function(x, y) {
      let distance = dist(this.x, this.y, x, y);
      let ang = angMod(angle(this.x, this.y, x, y));
      return this.r1 <= distance && distance <= this.r2 && (angMod2(ang - this.a1) + angMod2(this.a2 - ang) <= Math.PI * 2 || angMod2(ang - this.a1 + Math.PI * 2) + angMod2(this.a2 - ang + Math.PI * 2) <= 2 * Math.PI);
    }
    
    this.move = function(dx, dy) {
        this.x += dx;
        this.y += dy;
        this.centerX += dx;
        this.centerY += dy;
    }
    
    this.rotate = function(da) {
        this.a1 += da;
        this.a2 += da;
        this.a2 -= Math.floor(this.a1 / Math.PI / 2) * Math.PI * 2;
        this.a1 -= Math.floor(this.a1 / Math.PI / 2) * Math.PI * 2;
        
        this.ax1 = Math.cos(this.a1);
        this.ay1 = Math.sin(this.a1);
        this.ax2 = Math.cos(this.a2);
        this.ay2 = Math.sin(this.a2);
        this.normalX1 = this.ay1;
        this.normalY1 = -this.ax1;
        this.normalX2 = -this.ay2;
        this.normalY2 = this.ax2;
        
        let maxX = (Math.ceil(this.a1 / Math.PI / 2) == Math.floor(this.a2 / Math.PI / 2) ? this.r2 : Math.max(this.r1 * this.ax1, this.r1 * this.ax2, this.r2 * this.ax1, this.r2 * this.ax2));
        let minX = (Math.ceil(this.a1 / Math.PI / 2 - 1 / 2) == Math.floor(this.a2 / Math.PI / 2 - 1 / 2) ? -this.r2 : Math.min(this.r1 * this.ax1, this.r1 * this.ax2, this.r2 * this.ax1, this.r2 * this.ax2));
        let maxY = (Math.ceil(this.a1 / Math.PI / 2 - 1 / 4) == Math.floor(this.a2 / Math.PI / 2 - 1 / 4) ? this.r2 : Math.max(this.r1 * this.ay1, this.r1 * this.ay2, this.r2 * this.ay1, this.r2 * this.ay2));
        let minY = (Math.ceil(this.a1 / Math.PI / 2 - 3 / 4) == Math.floor(this.a2 / Math.PI / 2 - 3 / 4) ? -this.r2 : Math.min(this.r1 * this.ay1, this.r1 * this.ay2, this.r2 * this.ay1, this.r2 * this.ay2));
        this.offsetX = (maxX + minX) / 2;
        this.offsetY = (maxY + minY) / 2;
        this.offsetSize = Math.max(maxX - minX, maxY - minY);
        
        this.angle = this.a1;
    }
}

function ListWall(wList) {
    this.wallType = "list";
    this.walls = wList;
    this.wRest = this.walls[0].wRest;
    this.wFrict = this.walls[0].wFrict;
    this.color = this.walls[0].color;
    
    this.setDim = function() {
      let num = 0;
      let totalX = 0;
      let totalY = 0;
      let maxX = Number.NEGATIVE_INFINITY;
      let minX = Number.POSITIVE_INFINITY;
      let maxY = Number.NEGATIVE_INFINITY;
      let minY = Number.POSITIVE_INFINITY;
      for (let w of this.walls) {
        num += 1;
        totalX += w.centerX;
        totalY += w.centerY;
        for (let n = 0; n < w.num; n++) {
          if (w.x[n] > maxX) {
            maxX = w.x[n];
          }
          if (w.x[n] < minX) {
            minX = w.x[n];
          }
          if (w.y[n] > maxY) {
            maxY = w.y[n];
          }
          if (w.y[n] < minY) {
            minY = w.y[n];
          }
        }
      }
      if (num == 0) {
        this.centerX = 0;
        this.centerY = 0;
      } else {
        this.centerX = totalX / num;
        this.centerY = totalY / num;
      }
      this.offsetX = (maxX + minX) / 2 - this.centerX;
      this.offsetY = (maxY + minY) / 2 - this.centerY;
      this.offsetSize = Math.max(maxX - minX, maxY - minY);
      this.angle = 0;
    }
    
    this.setDim();
    
    this.show = function() {
      drawListWall(this.walls);
    }
    
    this.containsPoint = function(x, y) {
        for (t of this.walls) {
            if (t.containsPoint(x, y)) {
                return true;
            }
        }
        return false;
    }
    
    this.move = function(dx, dy) {
        this.centerX += dx;
        this.centerY += dy;
        for (w of this.walls) {
            w.move(dx, dy);
        }
    }
    
    this.rotate = function(da) {
      let maxX = Number.NEGATIVE_INFINITY;
      let minX = Number.POSITIVE_INFINITY;
      let maxY = Number.NEGATIVE_INFINITY;
      let minY = Number.POSITIVE_INFINITY;
      this.angle += da;
      for (let w of this.walls) {
        w.rotate(da);
        let dax = Math.cos(da);
        let day = Math.sin(da);
        w.move((w.centerX - this.centerX) * (dax - 1) - (w.centerY - this.centerY) * day, (w.centerX - this.centerX) * day + (w.centerY - this.centerY) * (dax - 1));
        for (let n = 0; n < w.num; n++) {
          if (w.x[n] > maxX) {
            maxX = w.x[n];
          }
          if (w.x[n] < minX) {
            minX = w.x[n];
          }
          if (w.y[n] > maxY) {
            maxY = w.y[n];
          }
          if (w.y[n] < minY) {
            minY = w.y[n];
          }
        }
      }
      this.offsetX = (maxX + minX) / 2 - this.centerX;
      this.offsetY = (maxY + minY) / 2 - this.centerY;
      this.offsetSize = Math.max(maxX - minX, maxY - minY);
    }
    
    this.setWRest = function(wRest) {
      this.wRest = wRest;
      for (let w of this.walls) {
        w.wRest = wRest;
      }
    }
    
    this.setWFrict = function(wFrict) {
      this.wFrict = wFrict;
      for (let w of this.walls) {
        w.wFrict = wFrict;
      }
    }
    
    this.setColor = function(color) {
      this.color = color;
      for (let w of this.walls) {
        w.color = color;
      }
    }
}

  this.eMode = false;
  this.eValue = 0;
  this.eSign = 1;
  
  this.x = () => menu.width / 2;
  this.y = () => this.n * menu.width * 7 / 20 + menu.width * 9 / 40;
  this.sx = () => menu.width * 4 / 5 * (this.clickable && this.hovered ? this.hoverFactor : 1)
  this.sy = () => menu.width / 4 * (this.clickable && this.hovered ? this.hoverFactor : 1)
  
  this.show = function() {

    ctxMenu.fillRect(this.x() - this.sx() / 2, this.y() - this.sy() / 2, this.sx(), this.sy());
    
    ctxMenu.fillStyle = (this.clicked ? "white" : "black");

    ctxMenu.textAlign = "center";
    ctxMenu.textBaseline = "middle";
    ctxMenu.fillText(this.get(), this.x(), this.y());
  }
  
  this.getValue = () => this.clicked ? this.sign * this.value * 10 ** (this.eSign * this.eValue) : this.rawGet();
  
  this.get = () => (title + ": " + (truncate(this.getValue())));
  
  this.updateHover = function(x, y) {
    this.hovered = this.x() - this.sx() / 2 <= x && x <= this.x() + this.sx() / 2 && this.y() - this.sy() / 2 <= y && y <= this.y() + this.sy() / 2;
  }
  
  this.click = function() {
    if (pressedKeys.includes("control")) {
      navigator.clipboard.writeText(this.getValue());
    } else if (this.clickable) {
      this.clicked = true;
      this.value = 0;
      this.digit = 0;
      this.sign = 1;
      this.eMode = false;
      this.eValue = 0;
      this.eSign = 1;
    }
  }
  
  this.updateValue = function(num) {
    if (num == "e") {
      if (this.value == 0) {
        this.value = 1;
      }
      this.eMode = true;
    } else if (this.eMode) {
      if (num == "-") {
        this.eSign *= -1;
      } else if (!isNaN(+num)) {
        this.eValue = this.eValue * 10 + (+num);
      }
    } else if (num == "-") {
        this.sign *= -1;
    } else if (num == "." && this.digit == 0) {
        this.digit = 1;
    } else if (!isNaN(+num)) {
      if (this.digit == 0) {
        this.value = this.value * 10 + (+num);
      } else {
        this.value += num / 10 ** this.digit;
        this.digit += 1;
      }
    }
  }
  
  this.back = function() {
    if (this.eMode) {
      if (this.eValue == 0) {
        this.eMode = false;
        this.eSign = 1;
      } else {
        this.eValue = Math.floor(this.eValue / 10);
      }
    } else {
      if (this.digit == 1) {
        this.digit = 0;
      } else if (this.value == 0) {
        this.sign = 1;
      } else if (this.digit == 0) {
        this.value = Math.floor(this.value / 10);
      } else {
        this.digit -= 1;
        this.value = Math.floor(this.value * 10 ** (this.digit - 1)) / 10 ** (this.digit - 1);
      }
    }
  }
  
  this.esc = function() {
    this.clicked = false;
  }
  
  this.set = function() {
    this.rawSet(this.sign * this.value * 10 ** (this.eSign * this.eValue));
    this.clicked = false;
  }
  
}

    ctxMenu.fillStyle = (this.clicked ? "white" : "black");
    ctxMenu.font = menu.width * 2 / 21 + "px Arial"
    ctxMenu.textAlign = "center";
    ctxMenu.textBaseline = "middle";
    ctxMenu.fillText(this.get(), this.x(), this.y());
  }
  
  this.getValue = () => this.clicked ? this.value : this.rawGet();
  
  this.get = () => (title + ": " + (this.getValue()));
  
  this.updateHover = function(x, y) {
    this.hovered = this.x() - this.sx() / 2 <= x && x <= this.x() + this.sx() / 2 && this.y() - this.sy() / 2 <= y && y <= this.y() + this.sy() / 2;
  }
  
  this.click = function() {
    if (pressedKeys.includes("control")) {
      navigator.clipboard.writeText(this.getValue());
    } else if (this.clickable) {
      this.clicked = true;
      this.value = "";
    }
  }
  
  this.updateValue = function(char) {
    if (char.length == 1) {
      this.value += char;
    }
  }
  
  this.back = function() {
     this.value = this.value.slice(0, this.value.length - 1);
  }
  
  this.esc = function() {
    this.clicked = false;
  }
  
  this.set = function() {
    this.rawSet(this.value);
    this.clicked = false;
  }
  
}

function gotoMainMenu() {
  menuType = (dragObj == null ? "main" : (dragObj.wallType == undefined ? "ball_main" : "wall_main"));
}

function listWallSize(x, y, mx, my) {
    //////use distance
    let pn = Math.floor((x.length - 1) * 9 / 10);
                //document.getElementById("p").innerHTML += ((mx - x[pn]) * (y[pn] - y[x.length - 1]) + (my - y[pn]) * (x[x.length - 1] - x[pn])) / dist(x[pn], y[pn], x[x.length - 1], y[x.length - 1]);
    return ((mx - x[pn]) * (y[pn] - y[x.length - 1]) + (my - y[pn]) * (x[x.length - 1] - x[pn])) / dist(x[pn], y[pn], x[x.length - 1], y[x.length - 1]);
}

function getListWall(x, y, size, color) {
  let wList = [];
  let pn = 0;
  let distance;
  
  let n1;
  for (let n = 1; n < x.length; n++) {
    distance = dist(x[0], y[0], x[n], y[n]);
    if (distance >= gameHeight * listWallInc) {
      n1 = n;
      break;
    }
  }
  
  let normalX = (y[0] - y[n1]) / distance;
  let normalY = (x[n1] - x[0]) / distance;
  let pox = x[0] + normalX * size;
  let poy = y[0] + normalY * size;
  
  let ox;
  let oy;
  for (let n = n1; n < x.length; n++) {
    distance = dist(x[pn], y[pn], x[n], y[n]);
    if (distance >= gameHeight * listWallInc || n == x.length - 1) {
      normalX = (y[pn] - y[n]) / distance;
      normalY = (x[n] - x[pn]) / distance;
      ox = (x[pn] + x[n]) / 2 + normalX * size;
      oy = (y[pn] + y[n]) / 2 + normalY * size;
      
      wList.push([[pox, x[pn], ox], [poy, y[pn], oy], wRestCoef, wFrictCoef, color]);
      wList.push([[x[pn], ox, x[n]], [y[pn], oy, y[n]], wRestCoef, wFrictCoef, color]);
      
      pn = n;
      pox = ox;
      poy = oy;
    }
  }
  wList.push([[pox, x[pn], x[pn] + normalX * size], [poy, y[pn], y[pn] + normalY * size], wRestCoef, wFrictCoef, color]);
  return new ListWall(getWalls(wList));
}

function parametricWall(x, y, t0, t1, dt, size, color) {
  let xl = [];
  let yl = [];
  for (let t = t0; t <= t1; t += dt) {
      xl.push(x(t));
      yl.push(y(t));
  }
  return getListWall(xl, yl, size, color);
}

function getWalls(l) {
    let wList = [];
    for (w of l) {
        wList.push(new TriWall(...w));
    }
    return wList;
}

function createBall() {
  let newSize = 2 * alignNum(dist(newX1, newY1, mouseX, mouseY));
  balls.push(new Ball(newX1, newY1, alignAngle(angle(newX1, newY1, mouseX, mouseY)), 0, 0, 0, density * newSize ** 3, newSize, moiCoef, dragCoef0, dragCoef1, dragCoef2, newColor));
  
  newX1 = null;
  newY1 = null;
}

function createRectWall() {
  let size = alignNum(((mouseX - newX1) * (newY1 - newY2) + (mouseY - newY1) * (newX2 - newX1)) / dist(newX1, newY1, newX2, newY2));
  walls.push(new RectWall(newX1, newY1, newX2, newY2, size, wRestCoef, wFrictCoef, newColor));
  
  newX1 = null;
  newY1 = null;
  newX2 = null;
  newY2 = null;
  newA = null;
}

function createTriWall() {
  let aligned = alignLine(newX2, newY2, mouseX, mouseY);
  walls.push(new TriWall([newX1, newX2, aligned[0]], [newY1, newY2, aligned[1]], wRestCoef, wFrictCoef, newColor));
  
  newX1 = null;
  newY1 = null;
  newX2 = null;
  newY2 = null;
}

function createCircleWall() {
    let r1 = alignNum(dist(newX1, newY1, newX2, newY2));
    let r2 = alignNum(dist(newX1, newY1, mouseX, mouseY));
    if (Math.abs(r2 - r1) < minDrag / scaleFactor) {
        r2 = 0;
    }
    let a1 = angle(newX1, newY1, newX2, newY2);
    let a2 = alignAngle(a1 + newA);
    if (Math.abs(a2 - a1) * (r1 + r2) / 2 < minDrag / scaleFactor || Math.abs(a2 - a1) >= Math.PI * 2) {
        a2 = a1 + (a2 - a1 >= 0 ? 1 : -1) * Math.PI * 2;
    }
    walls.push(new CircleWall(newX1, newY1, Math.min(r1, r2), Math.max(r1, r2), a1, a2, wRestCoef, wFrictCoef, newColor));
    newX1 = null;
    newY1 = null;
    newX2 = null;
    newY2 = null;
}

function createListWall() {
  walls.push(getListWall(newX1, newY1, listWallSize(newX1, newY1, mouseX, mouseY), newColor));
  
  newX1 = null;
  newY1 = null;
  newX2 = null;
  newY2 = null;
}

function drag(mode) {
    if (dragObj.wallType == undefined) {
      if (mode) {
        if (dragMode == true) {
            dragOffsetX = dragObj.px - mouseX;
            dragOffsetY = dragObj.py - mouseY;
            dragvx = [];
            dragvy = [];
        } else if (dragMode == false) {
            dragOffsetA = dragObj.pa - angle(dragObj.px, dragObj.py, mouseX, mouseY);
            dragva = [];
        }
      } else {
        if (dragMode == true) {
          dragObj.px = alignX(mouseX + dragOffsetX);
          dragObj.py = alignY(mouseY + dragOffsetY);
          dragObj.vx = (dragvx.length == 0 ? 0 : average(dragvx)) / rawMaindt / speed;
          dragObj.vy = (dragvy.length == 0 ? 0 : average(dragvy)) / rawMaindt / speed;
        } else if (dragMode == false) {
          dragObj.pa = alignAngle(angle(b.px, b.py, mouseX, mouseY) + dragOffsetA);
          dragObj.va = (dragva.length == 0 ? 0 : average(dragva)) / rawMaindt / speed;
        }
      }
    } else {
      if (mode) {
        if (dragMode == true) {
          dragOffsetX = dragObj.centerX - mouseX;
          dragOffsetY = dragObj.centerY - mouseY;
        } else if (dragMode == false) {
          dragOffsetA = dragObj.angle - angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY);
        }
      } else {
        if (dragMode == true) {
          dragObj.move(alignX(mouseX + dragOffsetX) - dragObj.centerX, alignY(mouseY + dragOffsetY) - dragObj.centerY);
        } else if (dragMode == false) {
          dragObj.rotate(alignAngle(angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY) + dragOffsetA) - dragObj.angle);
        }
      }
    }
}

function checkClick() {
    if (newX2 != null) {
        switch (dragType) {
            case "w":
                if (dist(newX1, newY1, ...alignLine(newX1, newY1, mouseX, mouseY)) >= minDrag / scaleFactor) {
                    createRectWall();
                }
                break;
            case "t":
                if (dist(newX1, newY1, ...alignLine(newX1, newY1, mouseX, mouseY)) >= minDrag / scaleFactor) {
                    createTriWall();
                }
                break;
            case "c":
                createCircleWall();
                break;
            case "l":
                if (dist(newX1[0], newY1[0], mouseX, mouseY) >= minDrag / scaleFactor) {
                    createListWall();
                }
                break;
        }
    } else if (newX1 != null) {
        let aligned;
        switch (dragType) {
          case "b":
            if (dist(newX1, newY1, mouseX, mouseY) >= minDrag / scaleFactor) {
                createBall();
            }
            break;
          case "w":
          case "t":
            aligned = alignLine(newX1, newY1, mouseX, mouseY);
            newX2 = aligned[0];
            newY2 = aligned[1];
            newA = 0;
            break;
          case "c":
            aligned = alignDist(newX1, newY1, mouseX, mouseY);
            newX2 = aligned[0];
            newY2 = aligned[1];
            newA = 0;
            break;
          case "l":
            if (newX1.length >= 2) {
                newX2 = true;
                newY2 = true;
            }
            break;
        }
    } else if (dragObj != null) {
        drag();
        dragObj = null;
        menuType = "main";
    } else {
        return false;
    }
    return true;
}

function updateMenuObjHover() {
  if (dragObj != null) {
    if (menuType.includes("ball") && menuType != "ball_main") {
      menuObjHovered = dist(menu.width / 2, menu.width * 2 / 5, clientX - main.width, clientY + document.getElementById("scroll").scrollTop) <= menu.width * 3 / 10 * (menuObjHovered ? 1.08 : 1);
    } else if (menuType.includes("wall") && menuType != "wall_main") {
      let sizeScale = dragObj.offsetSize / menu.width / 3 * 5 / (menuObjHovered ? 1.08 : 1);
      menuObjHovered = dragObj.containsPoint((clientX - main.width - menu.width / 2) * sizeScale + dragObj.centerX + dragObj.offsetX, (menu.width * 2 / 5 - clientY) * sizeScale + dragObj.centerY + dragObj.offsetY);
    }
  }
}

function deleteDragObj() {
  if (dragObj != null) {
      if (dragObj.wallType == undefined) {
          balls.splice(balls.indexOf(dragObj), 1);
      } else {
          walls.splice(walls.indexOf(dragObj), 1);
      }
      dragObj = null;
      menuType = "main";
  } else if (newX1 != null) {
      newX1 = null;
      newY1 = null;
      newX2 = null;
      newY2 = null;
      newA = null;
  }
}

function togglePause() {
  paused = !paused;
}

function doUpdate() {
  let dt = speed / fps / upf;
  if (dt > 0 && dt < 2 * speed / fps) {
    for (let n = 0; n < upf; n++) {
      update(dt, false);
    }
  }
}

document.onmousemove = function(event) {
    
    clientX = event.clientX;
    clientY = event.clientY;
    pmouseX = mouseX;
    pmouseY = mouseY;
    mouseX = getMouseX(clientX);
    mouseY = getMouseY(clientY);
    da = angle(newX1, newY1, mouseX, mouseY) - angle(newX1, newY1, pmouseX, pmouseY);
    if (Math.abs(da) > Math.PI) {
        da -= Math.sign(da) * Math.PI * 2;
    }
    if (newX2 != null) {
        newA += da;
        if (Math.abs(newA) >= Math.PI * 2) {
            newA -= Math.sign(newA) * Math.PI * 4;
        }
    } else if (newX1 != null && dragType == "l") {
        if (newX1.length == 0 || dist(newX1[newX1.length - 1], newY1[newY1.length - 1], mouseX, mouseY) > 0) {
            newX1.push(mouseX);
            newY1.push(mouseY);
        }
    }
    
    updateMenuObjHover();
    
    for (v of getMenuValues()) {
      v.updateHover(event.clientX - main.width, event.clientY + document.getElementById("scroll").scrollTop);
    }
    
}

document.onkeydown = function(event) {
  
  if (!pressedKeys.includes(event.key.toLowerCase())) {
    pressedKeys.push(event.key.toLowerCase());
  }
  
  if (inValue) {
    
    switch (event.key.toLowerCase()) {
        case "backspace":
            for (v of getMenuValues()) {
              if (v.clicked) {
                v.back();
              }
            }
            break;
        case "enter":
            for (v of getMenuValues()) {
              if (v.clicked) {
                inValue = false;
                v.set();
              }
            }
            break;
        case "escape":
            for (v of getMenuValues()) {
              if (v.clicked) {
                inValue = false;
                v.esc();
              }
            }
            break;
        default:
            for (v of getMenuValues()) {
              if (v.clicked) {
                v.updateValue(event.key);
              }
            }
    }
  } else {
    
    switch (event.key.toLowerCase()) {
        case "a":
            if (dragMode == undefined) {
                dragMode = false;
                if (dragObj != null) {
                    drag(true);
                }
            }
            break;
        case "b":
            setBallMode();
            break;
        case "c":
            setCircleWallMode();
            break;
        case "d":
            deleteDragObj();
            break;
        case "l":
            setListWallMode();
            break;
        case "m":
            if (dragMode == undefined) {
                dragMode = true;
                if (dragObj != null) {
                    drag(true);
                }
            }
            break;
        case "p":
            togglePause();
            break;
        case "r":
            resetObjects();
            break;
        case "t":
            setTriWallMode();
            break;
        case "u":
            doUpdate();
            break;
        case "w":
            setRectWallMode();
            break;
    }
  }
  
}

document.onkeyup = function(event) {
  
  if (pressedKeys.includes(event.key.toLowerCase())) {
    pressedKeys.splice(pressedKeys.indexOf(event.key.toLowerCase()), 1);
  }
  
  if (!inValue) {
    
    switch (event.key.toLowerCase()) {
        case "a":
            if (dragObj != null) {
                drag(false);
            }
            dragMode = undefined;
            break;
        case "m":
            if (dragObj != null) {
                drag(false);
            }
            dragMode = undefined;
            break;
    }
  }
    
}

main.onmousedown = function(event) {
  
  if (!inValue) {
  
    mouseX = getMouseX(event.clientX);
    mouseY = getMouseY(event.clientY);
    
    mouseDownX = mouseX;
    mouseDownY = mouseY;
    
    if (!checkClick()) {
      if (!pressedKeys.includes("control")) {
        for (b of balls) {
            if (b.containsPoint(mouseX, mouseY)) {
                dragObj = b;
                if (dragMode == true) {
                    dragOffsetX = dragObj.px - mouseX;
                    dragOffsetY = dragObj.py - mouseY;
                    dragvx = [];
                    dragvy = [];
                } else if (dragMode == false) {
                    dragOffsetA = dragObj.pa - angle(dragObj.px, dragObj.py, mouseX, mouseY);
                    dragva = [];
                }
                menuType = "ball";
            }
        }
        
        if (dragObj == null) {
            for (w of walls) {
                if (w.containsPoint(mouseX, mouseY)) {
                    dragObj = w;
                    if (dragMode == true) {
                        dragOffsetX = -mouseX;
                        dragOffsetY = -mouseY;
                    } else if (dragMode == false) {
                        dragOffsetA = dragObj.angle - angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY);
                    }
                    menuType = "wall";
                }
            }
        }
      }
      
      if (dragObj == null) {
          switch (dragType) {
              case "b":
                  newX1 = alignX(mouseX);
                  newY1 = alignY(mouseY);
                  break;
              case "w":
              case "t":
              case "c":
                  newX1 = alignX(mouseX);
                  newY1 = alignY(mouseY);
                  break;
              case "l":
                  newX1 = [mouseX];
                  newY1 = [mouseY];
                  break;
          }
      }
    }
  }
  
}

main.onmouseup = function(event) {
    
  if (!inValue) {
    
    mouseX = getMouseX(event.clientX);
    mouseY = getMouseY(event.clientY);
    
    if (dist(mouseDownX, mouseDownY, mouseX, mouseY) >= minDrag / scaleFactor) {
        checkClick();
    }
    
    mouseDownX = null;
    mouseDownY = null;
    
  }
    
}

menu.onmousedown = function(event) {
  
    if (inValue) {
      inValue = false;
      for (v of getMenuValues()) {
        if (v.clicked) {
          v.esc();
        }
      }
    }
    if (dragObj != null) {
      updateMenuObjHover();
      if (menuObjHovered) {
        shift((dragObj.wallType == undefined ? dragObj.px : dragObj.centerX) - gameWidth / 2 - screenX, (dragObj.wallType == undefined ? dragObj.py : dragObj.centerY) - gameHeight / 2 - screenY);
      }
    }
    for (v of getMenuValues()) {
      v.updateHover(event.clientX - main.width, event.clientY + document.getElementById("scroll").scrollTop);
      if (v.hovered) {
        for (let w of getMenuValues()) {
          w.hovered = false;
        }
        v.click();
        inValue = v.clicked;
        for (let w of getMenuValues()) {
          w.updateHover(event.clientX - main.width, event.clientY + document.getElementById("scroll").scrollTop);
        }
        break;
      }
    }
  }

function update(dt, end = true) {
  
  if (end && endTime >= 0 && gameTime + dt > endTime) {
    if (gameTime == endTime) return;
    dt = endTime - gameTime;
    if (gameTime < endTime) gameTime = endTime;
  } else {
    gameTime += dt;
  }
  
  if (dragObj != null && dragMode == true) {
    if (dragObj.wallType == undefined) {
      dragObj.pa += b.va * dt;
    }
  }
  
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update1(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update2(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update3(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update4(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update5(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update6(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update7(dt);
      }
  }
}

function show() {
  
  scale();
  ctxMain.fillStyle = "#efff9f";
  ctxMain.fillRect(screenX, screenY, main.width / scaleFactor, main.height / scaleFactor);
  
  for (w of walls) {
      w.show();
  }
  
  for (b of balls) {
      b.show();
  }
  
  if (newX2 != null) {
      let size;
      let aligned;
      switch (dragType) {
          case "w":
              size = alignNum(((mouseX - newX1) * (newY1 - newY2) + (mouseY - newY1) * (newX2 - newX1)) / dist(newX1, newY1, newX2, newY2));
              drawRectWall(newX1, newY1, newX2, newY2, size, newColor);
              break;
          case "t":
              aligned = alignLine(newX2, newY2, mouseX, mouseY);
              drawTriWall([newX1, newX2, aligned[0]], [newY1, newY2, aligned[1]], newColor);
              break;
          case "c":
              let r1 = alignNum(dist(newX1, newY1, newX2, newY2));
              let r2 = alignNum(dist(newX1, newY1, mouseX, mouseY));
              if (Math.abs(r2 - r1) < minDrag / scaleFactor) {
                  r2 = 0;
              }
              let a1 = angle(newX1, newY1, newX2, newY2);
              let a2 = alignAngle(a1 + newA);
              if (Math.abs(a2 - a1) * (r1 + r2) / 2 < minDrag / scaleFactor || Math.abs(a2 - a1) >= Math.PI * 2) {
                  a2 = a1 + (a2 - a1 >= 0 ? 1 : -1) * Math.PI * 2;
              }
              drawCircleWall(newX1, newY1, r1, r2, a1, a2, newColor);
              break;
          case "l":
              drawListWall(getListWall(newX1, newY1, listWallSize(newX1, newY1, mouseX, mouseY), newColor).walls);
              break;
      }
  } else if (newX1 != null) {
      switch (dragType) {
          case "b":
              let size = 2 * alignNum(dist(newX1, newY1, mouseX, mouseY));
              drawBall(newX1, newY1, alignAngle(angle(newX1, newY1, mouseX, mouseY)), size, newColor);
              break;
          case "w":
              scale();
              ctxMain.lineCap = "but" + "t";
              ctxMain.beginPath();
              ctxMain.moveTo(newX1, newY1);
              ctxMain.lineTo(...alignLine(newX1, newY1, mouseX, mouseY));
              ctxMain.strokeStyle = newColor;
              ctxMain.lineWidth = 2 / scaleFactor;
              ctxMain.stroke();
              break;
          case "t":
              scale();
              ctxMain.lineCap = "but" + "t";
              ctxMain.beginPath();
              ctxMain.moveTo(newX1, newY1);
              ctxMain.lineTo(...alignLine(newX1, newY1, mouseX, mouseY));
              ctxMain.strokeStyle = newColor;
              ctxMain.lineWidth = 2 / scaleFactor;
              ctxMain.stroke();
              break;
          case "c":
              scale();
              ctxMain.strokeStyle = newColor;
              ctxMain.lineWidth = 2 / scaleFactor;
              ctxMain.lineCap = "but" + "t";
              ctxMain.beginPath();
              ctxMain.moveTo(newX1, newY1);
              ctxMain.lineTo(...alignDist(newX1, newY1, mouseX, mouseY));
              ctxMain.stroke();
              break;
          case "l":
              scale();
              ctxMain.strokeStyle = newColor;
              ctxMain.lineWidth = 2 / scaleFactor;
              ctxMain.lineCap = "but" + "t";
              ctxMain.beginPath();
              ctxMain.moveTo(newX1[0], newY1[0])
              for (let n = 1; n < newX1.length; n++) {
                  ctxMain.lineTo(newX1[n], newY1[n]);
              }
              ctxMain.stroke();
              break;
      }
  }
  
}

function showMenu() {
  
  ctxMenu.fillStyle = "#1f0f6f";
  ctxMenu.fillRect(0, 0, menu.width, menu.height);
  
  if (dragObj != null) {
    if (menuType.includes("ball") && menuType != "ball_main") {
      drawBall(menu.width / 2, menu.width * 2 / 5, -dragObj.pa, menu.width * 3 / 5 * (menuObjHovered ? 1.08 : 1), dragObj.color, ctxMenu);
    } else if (menuType.includes("wall") && menuType != "wall_main") {
      let x;
      let y;
      let sizeScale = (menuObjHovered ? 1.08 : 1) * menu.width * 3 / 5 / dragObj.offsetSize;
      switch (dragObj.wallType) {
        case "rect":
          drawRectWall(menu.width / 2 + (dragObj.x1 - dragObj.centerX - dragObj.offsetX) * sizeScale, menu.width * 2 / 5 - (dragObj.y1 - dragObj.centerY - dragObj.offsetY) * sizeScale, menu.width / 2 + (dragObj.x2 - dragObj.centerX - dragObj.offsetX) * sizeScale, menu.width * 2 / 5 - (dragObj.y2 - dragObj.centerY - dragObj.offsetY) * sizeScale, -dragObj.size * sizeScale, dragObj.color, ctxMenu);
          break;
        case "tri":
          x = [];
          y = [];
          for (let n = 0; n < dragObj.num; n++) {
            x.push(menu.width / 2 + (dragObj.x[n] - dragObj.centerX - dragObj.offsetX) * sizeScale);
            y.push(menu.width * 2 / 5 - (dragObj.y[n] - dragObj.centerY - dragObj.offsetY) * sizeScale);
          }
          drawTriWall(x, y, dragObj.color, ctxMenu);
          break;
        case "circle":
          drawCircleWall(menu.width / 2 + (dragObj.x - dragObj.centerX - dragObj.offsetX) * sizeScale, menu.width * 2 / 5 - (dragObj.y - dragObj.centerY - dragObj.offsetY) * sizeScale, dragObj.r1 * sizeScale, dragObj.r2 * sizeScale, -dragObj.a2, -dragObj.a1, dragObj.color, ctxMenu);
          break;
        case "list":
          let wList = [];
          for (let w of dragObj.walls) {
            x = [];
            y = [];
            for (let n = 0; n < w.num; n++) {
              x.push(menu.width / 2 + (w.x[n] - dragObj.centerX - dragObj.offsetX) * sizeScale);
              y.push(menu.width * 2 / 5 - (w.y[n] - dragObj.centerY - dragObj.offsetY) * sizeScale);
            }
            wList.push([x, y, wRestCoef, wFrictCoef, w.color]);
          }
          drawListWall(getWalls(wList), ctxMenu);
          break;
      }
    }
  }
  
  ctxMenu.resetTransform();
  for (v of getMenuValues()) {
    v.show();
  }
  
}

function frame(time) {
  
  updateView();
  
  rawMaindt = (time - mainPTime) / 1000;
  
  if (rawMaindt * fps > 0.9) {
    
    if (!inValue) {
      if (pressedKeys.includes("arrowright")) {
          shift(main.width / scaleFactor / 5 * rawMaindt, 0);
      }
      if (pressedKeys.includes("arrowleft")) {
          shift(- main.width / scaleFactor / 5 * rawMaindt, 0);
      }
      if (pressedKeys.includes("arrowup")) {
          shift(0, main.height / scaleFactor / 5 * rawMaindt);
      }
      if (pressedKeys.includes("arrowdown")) {
          shift(0, - main.height / scaleFactor / 5 * rawMaindt);
      }
      if (pressedKeys.includes("=") || pressedKeys.includes("+")) {
          zoom(2 ** (-rawMaindt), mouseX, mouseY);
      }
      if (pressedKeys.includes("-") || pressedKeys.includes("_")) {
          zoom(2 ** rawMaindt, mouseX, mouseY);
      }
      if (pressedKeys.includes(".") || pressedKeys.includes(">")) {
          speed *= 2 ** rawMaindt;
      }
      if (pressedKeys.includes(",") || pressedKeys.includes("<")) {
          speed /= 2 ** rawMaindt;
      }
    }
    
    maindt = rawMaindt * speed;
    
    if (maindt > 0) {
        mainPTime = time;
    }
    
    if (time - pColorTime > 500) {
        newColor = randColor();
        pColorTime = time;
    }
    
    if (dragObj != null) {
        if (dragObj.wallType == undefined) {
            if (dragMode == true) {
                dragObj.px = alignX(mouseX + dragOffsetX);
                dragObj.py = alignY(mouseY + dragOffsetY);
                if (!isNaN(mouseX - pfmouseX) && !isNaN(mouseY - pfmouseY)) {
                  dragvx.push(mouseX - pfmouseX);
                  if (dragvx.length > dragVTime * fps) {
                      dragvx.shift();
                  }
                  dragvy.push(mouseY - pfmouseY);
                  if (dragvy.length > dragVTime * fps) {
                      dragvy.shift();
                  }
                }
            } else if (dragMode == false) {
                dragObj.pa = alignAngle(angle(dragObj.px, dragObj.py, mouseX, mouseY) + dragOffsetA);
                let va = angle(dragObj.px, dragObj.py, mouseX, mouseY) - angle(dragObj.px, dragObj.py, pfmouseX, pfmouseY);
                if (va > Math.PI) {
                    va -= Math.PI;
                }
                if (!isNaN(va)) {
                  dragva.push(va);
                  if (dragva.length > dragVTime * fps) {
                      dragva.shift();
                  }
                }
            }
        } else {;
            if (dragMode == true) {
                dragObj.move(alignX(mouseX + dragOffsetX) - dragObj.centerX, alignY(mouseY + dragOffsetY) - dragObj.centerY);
            } else if (dragMode == false) {
                dragObj.rotate(alignAngle(angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY) + dragOffsetA) - dragObj.angle);
            }
        }
    }
    
    if (!paused) {
      let dt = rawMaindt * speed / upf;
      if (dt > 0 && dt < 2 * speed / fps) {
        for (let n = 0; n < upf; n++) {
          update(dt);
        }
      }
    }
    
    setMenuHeight();
    
    show();
    showMenu();
    
  }
  
  pfmouseX = mouseX;
  pfmouseY = mouseY;
  
  requestAnimationFrame(frame);
  
}

updateView();
setup();
show();
showMenu();
requestAnimationFrame(frame);
          
        </script>
