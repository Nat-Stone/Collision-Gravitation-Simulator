function resetObjects() {
  if (balls.length != 0) {
    if (newObj1 != null && newObj1.objType == "ball") {
      let a = newObj1.getA();
      let ax = Math.cos(a);
      let ay = Math.sin(a);
      newObj1 = new Point(newObj1.getX() + newX1 * ax - newY1 * ay, newObj1.getY() + newX1r * ay + newY1 * ax);
      newX1 = 0;
      newY1 = 0;
    } else if (newObj2 != null && newObj2.objType == "ball") {
      newObj2 = null;
    }
    for (let s of springs) {
      if (s.obj1.objType == "ball") s.pointifyObj1();
      if (s.obj2.objType == "ball") s.pointifyObj2();
    }
    if (dragObj != null && dragObj.objType == "ball") {
      deleteDragObj();
      gotoMenu("main");
    }
    balls = [];
  } else if (springs.length != 0) {
    if (dragObj != null && dragObj.objType == "spring") {
      deleteDragObj();
      gotoMenu("main");
    }
    springs = [];
  } else if (walls.length != 0) {
    if (newObj1 != null && newObj1.objType == "wall") {
      let a = newObj1.getA();
      let ax = Math.cos(a);
      let ay = Math.sin(a);
      newObj1 = new Point(newObj1.getX() + newX1 * ax - newY1 * ay, newObj1.getY() + newX1r * ay + newY1 * ax);
      newX1 = 0;
      newY1 = 0;
    } else if (newObj2 != null && newObj2.objType == "wall") {
      newObj2 = null;
    }
    if (dragObj != null) {
      deleteDragObj();
      gotoMenu("main");
    }
    walls = [];
  } else {
    newX1 = null;
    newY1 = null;
    newX2 = null;
    newY2 = null;
    newA = null;
    newObj1 = null;
    newObj2 = null;
  }
}

document.onmousemove = function(event) {
    
    clientX = event.clientX;
    clientY = event.clientY;
    pmouseX = mouseX;
    pmouseY = mouseY;
    mouseX = getMouseX(clientX);
    mouseY = getMouseY(clientY);
    
    da = angle(newX1, newY1, mouseX, mouseY) - angle(newX1, newY1, pmouseX, pmouseY);
    if (Math.abs(da) > Math.PI) {
        da -= Math.sign(da) * Math.PI * 2;
    }
    if (newX2 != null) {
      if (newA != null) {
        newA += da;
        if (Math.abs(newA) >= Math.PI * 2) {
            newA -= Math.sign(newA) * Math.PI * 4;
        }
      }
    } else if (newX1 != null && dragType == "l") {
        if (newX1.length == 0 || dist(newX1[newX1.length - 1], newY1[newY1.length - 1], mouseX, mouseY) > 0) {
            newX1.push(mouseX);
            newY1.push(mouseY);
        }
    }
    
    updateMenuObjHover();
    
    let n = menuObjShown() ? 2 : 0;
    for (v of getMenuValues()) {
      v.updateHover(event.clientX - main.width, event.clientY + document.getElementById("scroll").scrollTop, n);
      n += 1;
    }
    
}

document.onkeydown = function(event) {
  
  if (!pressedKeys.includes(event.key.toLowerCase())) {
    pressedKeys.push(event.key.toLowerCase());
  }
  
  if (inValue) {
    
    let n = menuObjShown() ? 2 : 0;
    switch (event.key.toLowerCase()) {
        case "backspace":
            for (v of getMenuValues()) {
              if (v.clicked) {
                v.back(n);
              }
              n += 1;
            }
            break;
        case "enter":
            for (v of getMenuValues()) {
              if (v.clicked) {
                inValue = false;
                v.set();
              }
            }
            break;
        case "escape":
            for (v of getMenuValues()) {
              if (v.clicked) {
                inValue = false;
                v.esc();
              }
            }
            break;
        default:
            for (v of getMenuValues()) {
              if (v.clicked) {
                v.updateValue(event.key);
              }
            }
    }
  } else {
    
    switch (event.key.toLowerCase()) {
        case "a":
            if (dragMode == undefined) {
                dragMode = false;
                if (dragObj != null) {
                    drag(true);
                }
            }
            break;
        case "b":
            setBallMode();
            break;
        case "c":
            setCircleWallMode();
            break;
        case "d":
            deleteDragObj();
            break;
        case "k":
            setSpringMode();
            break;
        case "l":
            setListWallMode();
            break;
        case "m":
            if (dragMode == undefined) {
                dragMode = true;
                if (dragObj != null) {
                    drag(true);
                }
            }
            break;
        case "p":
            togglePause();
            break;
        case "r":
            resetObjects();
            break;
        case "t":
            setTriWallMode();
            break;
        case "u":
            doUpdate();
            break;
        case "w":
            setRectWallMode();
            break;
    }
  }
  
}

document.onkeyup = function(event) {
  
  if (pressedKeys.includes(event.key.toLowerCase())) {
    pressedKeys.splice(pressedKeys.indexOf(event.key.toLowerCase()), 1);
  }
  
  if (!inValue) {
    
    switch (event.key.toLowerCase()) {
        case "a":
            if (dragObj != null) {
                drag(false);
            }
            dragMode = undefined;
            break;
        case "m":
            if (dragObj != null) {
                drag(false);
            }
            dragMode = undefined;
            break;
    }
  }
    
}

main.onmousedown = function(event) {
  
  if (!inValue) {
  
    mouseX = getMouseX(event.clientX);
    mouseY = getMouseY(event.clientY);
    
    mouseDownX = mouseX;
    mouseDownY = mouseY;
    
    if (checkClick()) {
      let search = true;
      if (!pressedKeys.includes("control")) {
        
        if (search) {
          for (s of springs.toReversed()) {
              if (s.containsPoint(mouseX, mouseY)) {
                dragObj = s;
                gotoMenu("spring");
                search = false;
                break;
              }
          }
        }
        
        if (search) {
          for (b of balls.toReversed()) {
              if (b.containsPoint(mouseX, mouseY)) {
                if (selectMenuObj) {
                  if (b != dragObj.obj1 && b != dragObj.obj2) {
                    dragObj["obj" + menuObjNum] = b;
                    selectMenuObj = false;
                    menuType = "spring";
                  }
                } else if (dragType == "k") {
                  if (newObj1 == null) {
                    newObj1 = b;
                  }
                } else {
                  dragObj = b;
                  if (dragMode == true) {
                      dragOffsetX = dragObj.px - mouseX;
                      dragOffsetY = dragObj.py - mouseY;
                      dragvx = [];
                      dragvy = [];
                  } else if (dragMode == false) {
                      dragOffsetA = dragObj.pa - angle(dragObj.px, dragObj.py, mouseX, mouseY);
                      dragva = [];
                  }
                  gotoMenu("ball");
                }
                search = false;
                break;
              }
          }
        }
        
        if (search) {
            for (w of walls.toReversed()) {
                if (w.containsPoint(mouseX, mouseY)) {
                  if (selectMenuObj) {
                    if (w != dragObj.obj1 && w != dragObj.obj2) {
                      dragObj["obj" + menuObjNum] = w;
                      selectMenuObj = false;
                      menuType = "spring";
                    }
                  } else if (dragType == "k") {
                    if (newObj1 == null) {
                      newObj1 = w;
                    }
                  } else {
                    dragObj = w;
                    if (dragMode == true) {
                        dragOffsetX = -mouseX;
                        dragOffsetY = -mouseY;
                    } else if (dragMode == false) {
                        dragOffsetA = dragObj.angle - angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY);
                    }
                    gotoMenu("wall");
                  }
                  search = false;
                  break;
                }
            }
        }
      }
      
      if (search) {
        if (selectMenuObj) {
          dragObj["obj" + menuObjNum] = new Point(mouseX, mouseY);
          dragObj["dx" + menuObjNum] = 0;
          dragObj["dy" + menuObjNum] = 0;
          selectMenuObj = false;
          menuType = "spring";
        } else if (dragType == "k") {
          if (newObj1 == null) {
            newObj1 = new Point(...alignPos(mouseX, mouseY));
            newX1 = 0;
            newY1 = 0;
          }
        }
      }
      
      if (dragObj == null) {
        switch (dragType) {
          case "b":
            newX1 = alignX(mouseX);
            newY1 = alignY(mouseY);
            break;
          case "w":
          case "t":
          case "c":
            newX1 = alignX(mouseX);
            newY1 = alignY(mouseY);
            break;
          case "l":
            newX1 = [mouseX];
            newY1 = [mouseY];
            break;
        }
      }
    }
  }
  
  pClickX = mouseX;
  pClickY = mouseY;
  
}

main.onmouseup = function(event) {
    
  if (!inValue) {
    
    mouseX = getMouseX(event.clientX);
    mouseY = getMouseY(event.clientY);
    
    if (dist(mouseDownX, mouseDownY, mouseX, mouseY) >= minDrag / scaleFactor) {
        checkClick();
    }
    
    mouseDownX = null;
    mouseDownY = null;
    
  }
  
  pClickX = mouseX;
  pClickY = mouseY;
    
}

menu.onmousedown = function(event) {
  
    if (inValue) {
      inValue = false;
      for (v of getMenuValues()) {
        if (v.clicked) {
          v.esc();
        }
      }
    }
    if (dragObj != null) {
      updateMenuObjHover();
      if (menuObjHovered) {
        let menuObj = getShownMenuObj();
        shift((menuObj.objType == "ball" ? menuObj.px : menuObj.centerX) - gameWidth / 2 - screenX, (menuObj.objType == "ball" ? menuObj.py : menuObj.centerY) - gameHeight / 2 - screenY);
      }
    }
    let n = menuObjShown() ? 2 : 0;
    for (v of getMenuValues()) {
      v.updateHover(event.clientX - main.width, event.clientY + document.getElementById("scroll").scrollTop, n);
      if (v.hovered) {
        for (let w of getMenuValues()) {
          w.hovered = false;
        }
        v.click();
        inValue = v.clicked;
        n = menuObjShown() ? 2 : 0;
        for (let w of getMenuValues()) {
          w.updateHover(event.clientX - main.width, event.clientY + document.getElementById("scroll").scrollTop, n);
          n += 1;
        }
        break;
      }
      n += 1;
    }
  }

      let total = 0;
      for (b of balls) {
        total += b.mass * (b.vx ** 2 + b.vy ** 2) / 2 + b.moi * b.va ** 2 / 2 - b.mass * (gx * (b.px + distOffsetX) + gy * (b.py + distOffsetY));
        if (G != 0) {
          for (b1 of balls) {
            if (b != b1) {
              total -= G * b.mass * b1.mass / dist(b.px, b.py, b1.px, b1.py) / 2;
            }
          }
        }
      }
      for (s of springs) {
        total += s.k * (dist(...s.getPos1(), ...s.getPos2()) - s.equilibrium) ** 2 / 2;
      }
      return total;
    })
  ];

function update(dt, end = true) {
  
  if (end && endTime >= 0 && gameTime + dt > endTime) {
    if (gameTime == endTime) return;
    dt = endTime - gameTime;
    if (gameTime < endTime) gameTime = endTime;
  } else {
    gameTime += dt;
  }
  
  if (dragObj != null && dragMode == true) {
    if (dragObj.objType == "ball") {
      dragObj.pa += b.va * dt;
    }
  }
  
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update1(dt);
      }
  }
  for (let s of springs) {
      s.force();
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update2(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update3(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update4(dt);
      }
  }
  for (let s of springs) {
      s.getEnergies();
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update5(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update6(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update7(dt);
      }
  }
  for (b of balls) {
      if (b != dragObj || dragMode == undefined) {
          b.update8(dt);
      }
  }
}

function show() {
  
  scale();
  ctxMain.fillStyle = "#efff9f";
  ctxMain.fillRect(screenX, screenY, main.width / scaleFactor, main.height / scaleFactor);
  
  for (w of walls) {
      w.show();
  }
  
  for (b of balls) {
      b.show();
  }
  
  for (s of springs) {
      s.show();
  }
  
  if (selectMenuObj) {
    if (!pressedKeys.includes("control")) {
      scale();
      let alphaColor = getRGBA(newColor, 50);
      let search = true;
      for (let b of balls.toReversed()) {
        if (b != dragObj.obj1 && b != dragObj.obj2 && b.containsPoint(mouseX, mouseY)) {
          search = false;
          drawBall(b.px, b.py, b.pa, b.size, alphaColor, ctx=ctxMain, lines=false);
          break;
        }
      }
      if (search) {
        for (let w of walls.toReversed()) {

            switch (w.objType) {
              case "rectWall":

                break;
              case "triWall":
                drawTriWall(w.x, w.y, alphaColor);
                break;
              case "circleWall":
                drawCircleWall(w.x, w.y, w.r1, w.r2, w.a1, w.a2, alphaColor);
                break;
              case "listWall":
                drawListWall(w.walls, alphaColor);
                break;
            }

          }
        }
      }

        }

      case "w":
        if (newX2 != null) {
          size = alignNum(((mouseX - newX1) * (newY1 - newY2) + (mouseY - newY1) * (newX2 - newX1)) / dist(newX1, newY1, newX2, newY2));
          drawRectWall(newX1, newY1, newX2, newY2, size, newColor);
        } else if (newX1 != null) {
          scale();
          ctxMain.lineCap = "but" + "t";
          ctxMain.beginPath();
          ctxMain.moveTo(newX1, newY1);
          ctxMain.lineTo(...alignLine(newX1, newY1, mouseX, mouseY));
          ctxMain.strokeStyle = newColor;
          ctxMain.lineWidth = 2 / scaleFactor;
          ctxMain.stroke();
        }
        break;
      case "t":
        if (newX2 != null) {
          aligned = alignLine(newX2, newY2, mouseX, mouseY);
          drawTriWall([newX1, newX2, aligned[0]], [newY1, newY2, aligned[1]], newColor);
        } else if (newX1 != null) {
          scale();
          ctxMain.lineCap = "but" + "t";
          ctxMain.beginPath();
          ctxMain.moveTo(newX1, newY1);
          ctxMain.lineTo(...alignLine(newX1, newY1, mouseX, mouseY));
          ctxMain.strokeStyle = newColor;
          ctxMain.lineWidth = 2 / scaleFactor;
            ctxMain.stroke();
        }
        break;
      case "c":
        if (newX2 != null) {
          let r1 = alignNum(dist(newX1, newY1, newX2, newY2));
          let r2 = alignNum(dist(newX1, newY1, mouseX, mouseY));
          if (Math.abs(r2 - r1) < minDrag / scaleFactor) {
              r2 = 0;
          }
          let a1 = angle(newX1, newY1, newX2, newY2);
          let a2 = alignAngle(a1 + newA);
          if (Math.abs(a2 - a1) * (r1 + r2) / 2 < minDrag / scaleFactor || Math.abs(a2 - a1) >= Math.PI * 2) {
              a2 = a1 + (a2 - a1 >= 0 ? 1 : -1) * Math.PI * 2;
          }
          drawCircleWall(newX1, newY1, r1, r2, a1, a2, newColor);
        } else if (newX1 != null) {
          scale();
          ctxMain.strokeStyle = newColor;
          ctxMain.lineWidth = 2 / scaleFactor;
          ctxMain.lineCap = "but" + "t";
          ctxMain.beginPath();
          ctxMain.moveTo(newX1, newY1);
          ctxMain.lineTo(...alignDist(newX1, newY1, mouseX, mouseY));
          ctxMain.stroke();
        }
        break;
      case "l":

          drawListWall(getListWall(newX1, newY1, alignNum(listWallSize(newX1, newY1, mouseX, mouseY)), newColor).walls, newColor);
        } else if (newX1 != null) {
          scale();
          ctxMain.strokeStyle = newColor;
          ctxMain.lineWidth = 2 / scaleFactor;
          ctxMain.lineCap = "but" + "t";
          ctxMain.beginPath();
          ctxMain.moveTo(newX1[0], newY1[0])
          for (let n = 1; n < newX1.length; n++) {
              ctxMain.lineTo(newX1[n], newY1[n]);
          }
          ctxMain.stroke();
        }
        break;
      case "k":
        scale();
        let alphaColor = getRGBA(newColor, 50);
        let x1;
        let y1;
        let x2;
        let y2;
        if (newX1 != null) {
          let ax;
          let ay;
          switch (newObj1.objType) {
            case "point":
              size = gameHeight / 20;
              x1 = newObj1.x;
              y1 = newObj1.y;
              break;
            case "ball":
              ax = Math.cos(newObj1.pa);
              ay = Math.sin(newObj1.pa);
              size = newObj1.size / 6;
              x1 = newObj1.px + newX1 * ax - newY1 * ay;
              y1 = newObj1.py + newX1 * ay + newY1 * ax;
              break;
            case "rectWall":
            case "triWall":
            case "circleWall":
            case "listWall":
              ax = Math.cos(newObj1.angle);
              ay = Math.sin(newObj1.angle);
              size = newObj1.offsetSize / 10;
              x1 = newObj1.centerX + newX1 * ax - newY1 * ay;
              y1 = newObj1.centerY + newX1 * ay + newY1 * ax;
              break;
          }
        }
        if (newX2 != null) {
          let a = newObj2.getA();
          let ax = Math.cos(a);
          let ay = Math.sin(a);
          x2 = newObj2.getX() + newX2 * ax - newY2 * ay;
          y2 = newObj2.getY() + newX2 * ay + newY2 * ax;
          if (x1 != x2 || y1 != y2) {
            let length = dist(x1, y1, x2, y2);
            size = 2 * alignNum(((mouseX - x2) * (y2 - y1) - (mouseY - y2) * (x2 - x1)) / length);
            if (Math.abs(size) * scaleFactor >= minDrag) drawSpring(x1, y1, x2, y2, size, Math.ceil(Math.abs(coilRatio * length / size)), Math.abs(thicknessRatio * size), newColor);
          }
        } else if (newObj2 != null) {
          let p2;
          switch (newObj2.objType) {
            case "point":
              p2 = alignLine(newObj1.getX() + newX1, newObj1.getY() + newY1, mouseX, mouseY);
              break;
            case "ball":
              p2 = alignDist(newObj2.px, newObj2.py, mouseX, mouseY, align=true, a1=newObj2.pa);
              break;
            case "rectWall":
            case "triWall":
            case "listWall":
              p2 = alignLine(newObj2.centerX, newObj2.centerY, mouseX, mouseY, align=true, ax=Math.cos(newObj2.angle), ay=Math.sin(newObj2.angle));
              break;
            case "circleWall":
              p2 = alignDist(newObj2.centerX, newObj2.centerY, mouseX, mouseY, align=true, a1=newObj2.a1);
              break;
          }
          ctxMain.beginPath();
          ctxMain.strokeStyle = newColor;
          ctxMain.lineCap = "round";
          ctxMain.lineWidth = 2 / scaleFactor;
          ctxMain.moveTo(x1, y1);
          ctxMain.lineTo(...p2);
          ctxMain.stroke();
        } else if (newX1 != null) {
          
          ctxMain.beginPath();
          ctxMain.strokeStyle = newColor;
          ctxMain.lineCap = "round";
          ctxMain.lineWidth = 2 / scaleFactor;
          ctxMain.moveTo(x1, y1);
          ctxMain.lineTo(...alignLine(x1, y1, mouseX, mouseY));
          ctxMain.stroke();
          
          if (!pressedKeys.includes("control")) {
            let search = true;
            for (let b of balls.toReversed()) {
              if (b != newObj1 && b.containsPoint(mouseX, mouseY)) {
                search = false;
                drawBall(b.px, b.py, b.pa, b.size, alphaColor, ctx=ctxMain, lines=false);
                break;
              }
            }
            if (search) {
              for (let w of walls.toReversed()) {
                if (w != newObj1 && w.containsPoint(mouseX, mouseY)) {
                  switch (w.objType) {
                    case "rectWall":
                      drawRectWall(w.x1, w.y1, w.x2, w.y2, w.size, alphaColor);
                      break;
                    case "triWall":
                      drawTriWall(w.x, w.y, alphaColor);
                      break;
                    case "circleWall":
                      drawCircleWall(w.x, w.y, w.r1, w.r2, w.a1, w.a2, alphaColor);
                      break;
                    case "listWall":
                      drawListWall(w.walls, alphaColor);
                      break;
                  }
                  break;
                }
              }
            }
          }
        } else if (newObj1 != null) {
          ctxMain.fillStyle = alphaColor;
          ctxMain.beginPath();
          switch (newObj1.objType) {
            case "ball":
              ctxMain.arc(...alignDist(newObj1.px, newObj1.py, mouseX, mouseY, align=true, a1=newObj1.pa), newObj1.size / 12, 0, Math.PI * 2);
              break;
            case "rectWall":
            case "triWall":
            case "listWall":
              ctxMain.arc(...alignLine(newObj1.centerX, newObj1.centerY, mouseX, mouseY, align=true, ax=Math.cos(newObj1.angle), ay=Math.sin(newObj1.angle)), newObj1.offsetSize / 20, 0, Math.PI * 2);
              break;
            case "circleWall":
              ctxMain.arc(...alignDist(newObj1.centerX, newObj1.centerY, mouseX, mouseY, align=true, a1=newObj1.a1), newObj1.offsetSize / 20, 0, Math.PI * 2);
              break;
          }
          ctxMain.fill();
        } else if (dragObj == null) {
          if (!pressedKeys.includes("control")) {
            let search = true;
            for (let b of balls.toReversed()) {

function showMenu() {
  
  ctxMenu.fillStyle = "#1f0f6f";
  ctxMenu.fillRect(0, 0, menu.width, menu.height);
  
  let obj = getShownMenuObj();
  if (obj != null) {
    let x;
    let y;
    let sizeScale = (menuObjHovered ? 1.08 : 1) * menu.width * 3 / 5 / obj.offsetSize;
    switch (obj.objType) {
      case "ball":
        drawBall(menu.width / 2, menu.width * 2 / 5, -obj.pa, menu.width * 3 / 5 * (menuObjHovered ? 1.08 : 1), obj.color, ctxMenu);
        break;
      case "rectWall":
        drawRectWall(menu.width / 2 + (obj.x1 - obj.centerX - obj.offsetX) * sizeScale, menu.width * 2 / 5 - (obj.y1 - obj.centerY - obj.offsetY) * sizeScale, menu.width / 2 + (obj.x2 - obj.centerX - obj.offsetX) * sizeScale, menu.width * 2 / 5 - (obj.y2 - obj.centerY - obj.offsetY) * sizeScale, -obj.size * sizeScale, obj.color, ctxMenu);
        break;
      case "triWall":
        x = [];
        y = [];
        for (let n = 0; n < obj.num; n++) {
          x.push(menu.width / 2 + (obj.x[n] - obj.centerX - obj.offsetX) * sizeScale);
          y.push(menu.width * 2 / 5 - (obj.y[n] - obj.centerY - obj.offsetY) * sizeScale);
        }
        drawTriWall(x, y, obj.color, ctxMenu);
        break;
      case "circleWall":
        drawCircleWall(menu.width / 2 + (obj.x - obj.centerX - obj.offsetX) * sizeScale, menu.width * 2 / 5 - (obj.y - obj.centerY - obj.offsetY) * sizeScale, obj.r1 * sizeScale, obj.r2 * sizeScale, -obj.a2, -obj.a1, obj.color, ctxMenu);
        break;
      case "listWall":
        let wList = [];
        for (let w of obj.walls) {
          x = [];
          y = [];
          for (let n = 0; n < w.num; n++) {
            x.push(menu.width / 2 + (w.x[n] - obj.centerX - obj.offsetX) * sizeScale);
            y.push(menu.width * 2 / 5 - (w.y[n] - obj.centerY - obj.offsetY) * sizeScale);
          }
          wList.push([x, y, wRestCoef, wSFrictCoef, wKFrictCoef, w.color]);
        }
        drawListWall(getWalls(wList), obj.color, ctxMenu);
        break;
      case "spring":
        obj.setVars();
        let menuScale = menu.width * 3 / 5 / obj.offsetSize * (menuObjHovered ? 1.08 : 1);
        let p1 = obj.getPos1();
        p1[0] = menu.width / 2 + (p1[0] - obj.centerX) * menuScale;
        p1[1] = menu.width * 2 / 5 - (p1[1] - obj.centerY) * menuScale;
        let p2 = obj.getPos2();
        p2[0] = menu.width / 2 + (p2[0] - obj.centerX) * menuScale;
        p2[1] = menu.width * 2 / 5 - (p2[1] - obj.centerY) * menuScale;
        drawSpring(...p1, ...p2, obj.size * menuScale, obj.coils, obj.thickness * menuScale, obj.color, ctxMenu);
        break;
    }
  }
  
  ctxMenu.resetTransform();
  let n = obj == null ? 0 : 2;
  for (v of getMenuValues()) {
    v.show(n);
    n += 1;
  }
  
}

function frame(time) {
  
  updateView();
  
  rawMaindt = Math.min((time - mainPTime) / 1000, 1 / fps);
  
  if (rawMaindt * fps > 0.9) {
    
    if (!inValue) {
      if (pressedKeys.includes("arrowright")) {
          shift(main.width / scaleFactor / 5 * rawMaindt, 0);
      }
      if (pressedKeys.includes("arrowleft")) {
          shift(- main.width / scaleFactor / 5 * rawMaindt, 0);
      }
      if (pressedKeys.includes("arrowup")) {
          shift(0, main.height / scaleFactor / 5 * rawMaindt);
      }
      if (pressedKeys.includes("arrowdown")) {
          shift(0, - main.height / scaleFactor / 5 * rawMaindt);
      }
      if (pressedKeys.includes("=") || pressedKeys.includes("+")) {
          zoom(2 ** (-rawMaindt), mouseX, mouseY);
      }
      if (pressedKeys.includes("-") || pressedKeys.includes("_")) {
          zoom(2 ** rawMaindt, mouseX, mouseY);
      }
      if (pressedKeys.includes(".") || pressedKeys.includes(">")) {
          speed *= 2 ** rawMaindt;
      }
      if (pressedKeys.includes(",") || pressedKeys.includes("<")) {
          speed /= 2 ** rawMaindt;
      }
    }
    
    maindt = rawMaindt * speed;
    
    if (maindt > 0) {
        mainPTime = time;
    }
    
    if (time - pColorTime > 500) {
        newColor = randColor();
        pColorTime = time;
    }
    
    if (dragObj != null) {
        if (dragObj.objType == "ball") {
            if (dragMode == true) {
                dragObj.px = alignX(mouseX + dragOffsetX);
                dragObj.py = alignY(mouseY + dragOffsetY);
                if (!isNaN(mouseX - pfmouseX) && !isNaN(mouseY - pfmouseY)) {
                  dragvx.push(mouseX - pfmouseX);
                  if (dragvx.length > dragVTime * fps) {
                      dragvx.shift();
                  }
                  dragvy.push(mouseY - pfmouseY);
                  if (dragvy.length > dragVTime * fps) {
                      dragvy.shift();
                  }
                }
            } else if (dragMode == false) {
                dragObj.pa = alignAngle(angle(dragObj.px, dragObj.py, mouseX, mouseY) + dragOffsetA);
                let va = angle(dragObj.px, dragObj.py, mouseX, mouseY) - angle(dragObj.px, dragObj.py, pfmouseX, pfmouseY);
                if (va > Math.PI) {
                    va -= Math.PI;
                }
                if (!isNaN(va)) {
                  dragva.push(va);
                  if (dragva.length > dragVTime * fps) {
                      dragva.shift();
                  }
                }
            }
        } else {;
            if (dragMode == true) {
                dragObj.move(alignX(mouseX + dragOffsetX) - dragObj.centerX, alignY(mouseY + dragOffsetY) - dragObj.centerY);
            } else if (dragMode == false) {
                dragObj.rotate(alignAngle(angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY) + dragOffsetA) - dragObj.angle);
            }
        }
    }
    
    if (!paused) {
      let dt = rawMaindt * speed / upf;
      if (dt > 0 && dt < 2 * speed / fps) {
        for (let n = 0; n < upf; n++) {
          update(dt);
        }
      }
    }
    
    setMenuHeight();
  
    show();
    showMenu();
    
  }
  
  pfmouseX = mouseX;
  pfmouseY = mouseY;
  
  requestAnimationFrame(frame);
  
}

updateView();
setup();
show();
showMenu();
requestAnimationFrame(frame);
          
        </script>
    </body>
</html>
