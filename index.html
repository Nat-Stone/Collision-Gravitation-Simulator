            body {
                margin: 0;
                padding: 0;
            }
            
            canvas {
                display: inline-block;
                float: left;
            }

              position: absolute;
              left: 80%;
              overflow: scroll;
              max-height: 100%;
            }
        </style>
        
        <canvas id="main"></canvas>
        <div id="scroll">
          <canvas id="menu"></canvas>
        </div>

        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
        <p id="p4"></p>
        <p id="p5"></p>
        -->
        <script>
          
/*
notes:
this version has all instances of "*****" replaced with "but" + "t"
*/
const widthFactor = 0.8;

const main = document.getElementById("main");
const ctxMain = main.getContext("2d");

const menu = document.getElementById("menu");
const ctxMenu = menu.getContext("2d");

let pWidth;
let pHeight;
let gameWidth;
let scaleFactor;

const eps = 10 ** -6;

let gameHeight = 10;
let screenX = 0;
let screenY = 0;
let fps = 60;
let upf = 100;
let speed = 1;
const dragVTime = 1 / 10;
const minDrag = 2;
const listWallInc = 0.01;
let mainPTime = 0;
let rawMaindt = 0;
let maindt = 0;
let distOffsetX = 0;
let distOffsetY = 0;

let paused = false;
let gameTime = 0;
let endTime = -1;
let clientX = null;
let clientY = null;
let mouseX = null;
let mouseY = null;
let pmouseX = null;
let pmouseY = null;
let pfmouseX = null;
let pfmouseY = null;
let mouseDownX = null;
let mouseDownY = null;
let pClickX = null;
let pClickY = null;
let newX1 = null;
let newY1 = null;
let newX2 = null;
let newY2 = null;
let newA = null;
let newObj1 = null;
let newObj2 = null;
let dragType = "b";
let dragMode = undefined;
let dragObj = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let dragOffsetA = 0;
let dragvx = [];
let dragvy = [];
let dragva = [];
let pColorTime = 0;
let newColor = randColor();
let pressedKeys = [];

let walls = [];
let balls = [];
let springs = [];
let G = 0;
let gx = 0;
let gy = 0;
let bRestCoef = 0.99;
let bSFrictCoef = 0.5;
let bKFrictCoef = 0.2;
let windVX = 0;
let windVY = 0;
let collide = true;
let distInc = 1/2;
let angInc = 15;
let density = 1;
let moiCoef = 1/2;
let wRestCoef = 0.99;
let wSFrictCoef = 0.5;
let wKFrictCoef = 0.2;
let dragCoef0 = 0;
let dragCoef1 = 0;
let dragCoef2 = 0;
let ballMovable = true;
let ballRotatable = true;
let kCoef = 100;
let coilRatio = 5;
let thicknessRatio = 0.1;
let push = true;
let inValue = false;
let menuObjHovered = false;

let menuType = "main";
let menuObjNum;
let selectMenuObj = false;
let menuValues = {};

function updateView() {
  if (window.innerWidth != pWidth || window.innerHeight != pHeight) {
    main.width = window.innerWidth * widthFactor;
    main.height = window.innerHeight;
    
    menu.width = window.innerWidth * (1 - widthFactor);
    menu.height = window.innerHeight;
    menu.left = window.innerHeight * widthFactor;
    
    gameWidth = gameHeight * main.width / main.height;
    scaleFactor = main.height / gameHeight;
    
    pWidth = window.innerWidth;
    pHeight = window.innerHeight;
  }
}

function scale() {
  ctxMain.resetTransform();
  ctxMain.scale(scaleFactor, -scaleFactor);
  ctxMain.translate(- screenX, - gameHeight - screenY);
}

function getMouseX(x) {
  return x / scaleFactor + screenX;
}

function getMouseY(y) {
  return gameHeight - y / scaleFactor + screenY;
}

function shift(dx, dy) {
  let dx1 = Math.round((screenX + distOffsetX + dx) / distInc) * distInc;
  let dy1 = Math.round((screenY + distOffsetY + dy) / distInc) * distInc;
  distOffsetX += dx - dx1;
  distOffsetY += dy - dy1;
  mouseX -= dx;
  mouseY -= dy;
  pmouseX -= dx;
  pmouseY -= dy;
  pfmouseX -= dx;
  pfmouseY -= dy;
  mouseDownX -= dx;
  mouseDownY -= dy;
  for (let b of balls) {
    b.move(-dx, -dy);
  }
  for (let w of walls) {
    w.move(-dx, -dy);
  }
  for (let s of springs) {
    if (s.obj1.objType == "point") s.obj1.move(-dx, -dy);
    if (s.obj2.objType == "point") s.obj2.move(-dx, -dy);
  }
  if (dragType != "k") {
    if (newX1 != null) {
      if (dragType == "l") {
        for (let n = 0; n < newX1.length; n++) {
          newX1[n] -= dx;
          newY1[n] -= dy;
        }
      } else {
        newX1 -= dx;
        newY1 -= dy;
      }
    }
    if (newX2 != null) {
      newX2 -= dx;
      newY2 -= dy;
    }
  }
}

function zoom(factor, x, y) {
  if (x == undefined) {
    x = screenX + gameWidth / 2;
  }
  if (y == undefined) {
    y = screenY + gameHeight / 2;
  }
  scaleFactor /= factor;
  gameWidth *= factor;
  gameHeight *= factor;
  shift((screenX - x) * (factor - 1), (screenY - y) * (factor - 1));
}

function setMenuHeight() {
  let num = getMenuValues().length + (menuObjShown() ? 2 : 0);
  menuHeight = Math.max(window.innerHeight, menu.width * (14 * num + 4) / 40);
  if (menu.innerHeight != menuHeight) {
    menu.height = menuHeight;
  }
}

function getMenuValues() {
  return menuValues[menuType];
}

function getShownMenuObj() {
  return menuObjShown() ? (dragObj.objType == "spring" && menuType != "spring" && menuType != "spring_general" ? dragObj["obj" + menuObjNum] : dragObj) : null;
}

function menuBallShown() {
  return (menuType == "ball" || (menuType.includes("ball_") && menuType != "ball_main")) || ((menuType == "spring_point" || menuType == "spring_object") && dragObj != null && dragObj.objType == "spring" && dragObj["obj" + menuObjNum].objType == "ball");
}

function menuWallShown() {
  return (menuType == "wall" || (menuType.includes("wall_") && menuType != "wall_main")) || ((menuType == "spring_point" || menuType == "spring_object") && dragObj != null && dragObj.objType == "spring" && dragObj["obj" + menuObjNum].objType.includes("Wall"));
}

function menuSpringShown() {
  return menuType == "spring" || menuType == "spring_general";
}

function menuObjShown() {
  return menuBallShown() || menuWallShown() || menuSpringShown();
}

function dist(x1, y1, x2, y2) {
    return Math.sqrt((x2-x1) * (x2-x1) + (y2-y1) * (y2-y1));
}

function sqdist(x1, y1, x2, y2) {
    return (x2-x1) * (x2-x1) + (y2-y1) * (y2-y1);
}

function angle(x1, y1, x2, y2) {
    return Math.atan2(y2 - y1, x2 - x1);
}

function randColor() {
    return "rgb(" + (256 * Math.random()) + ", " + (256 * Math.random()) + ", " + (256 * Math.random()) + ")";
}

function getRGBA(color, a) {
  return color.substring(0, color.length - 1) + ", " + a + "%)";
}

function angMod(a) {
    if (a > 0) {
        return a % (Math.PI * 2);
    } else {
        return a % (Math.PI * 2) + Math.PI * 2;
    }
}

function angMod2(a) {
    if (a > 0) {
        return a % (Math.PI * 4);
    } else {
        return a % (Math.PI * 4) + Math.PI * 4;
    }
}

function alignNum(n, align = true) {
  return (align && pressedKeys.includes("shift") ? Math.round(n / distInc) * distInc : n);
}

function alignX(x, align = true) {
  return alignNum(screenX + x, align) - screenX;
}

function alignY(y, align = true) {
  return alignNum(screenY + y, align) - screenY;
}

function alignPos(x, y, align = true) {
  return [alignX(x, align), alignY(y, align)];
}

function alignAngle(a, align = true, a1 = 0, revert = true) {
  return (align && pressedKeys.includes("control") ? (revert ? a1 : 0) + Math.round((a - a1) * 180 / angInc / Math.PI) * Math.PI * angInc / 180 : a - (revert ? 0 : a1));
}

function alignDist(x1, y1, x2, y2, align = true, a1 = 0, revert = true) {
  let r = alignNum(dist(x1, y1, x2, y2), align);
  let a = alignAngle(angle(x1, y1, x2, y2), align, a1, revert);
  return [x1 + r * Math.cos(a), y1 + r * Math.sin(a)];
}

function alignLine(x1, y1, x2, y2, align = true, ax = 1, ay = 0, revert = true) {
  let r = dist(x1, y1, x2, y2);
  let a = alignAngle(angle(0, 0, (x2 - x1) * ax + (y2 - y1) * ay, - (x2 - x1) * ay + (y2 - y1) * ax), !pressedKeys.includes("shift") && align);
  let p = alignPos(r * Math.cos(a), r * Math.sin(a), align);
  return (revert ? [x1 + p[0] * ax - p[1] * ay, y1 + p[0] * ay + p[1] * ax] : [x1 + p[0], y1 + p[1]]);
}

function sum(arr) {
  let total = 0;
  for (n of arr) {
    if (!isNaN(n)) {
      total += n;
    }
  }
  return total;
}

function average(arr) {
  let num = 0;
  let total = 0;
  for (n of arr) {
    if (!isNaN(n)) {
      num += 1;
      total += n;
    }
  }
  if (num > 0) {
      return total / num;
  } else {
      return null;
  }
}

function truncate(num) {
  if (num == 0) {
    return 0;
  }
  let zeros = Math.floor(Math.log10(Math.abs(num)))
  return Math.round(num / 10 ** (zeros - 2)) / 100 + "e" + (zeros > 0 ? "+" : "") + zeros;
}

function stringifyColor(color) {
  if (color.includes(",")) {
    color.replace(" ", "");
    let text = "";
    for (let c of color.substring(4, color.length - 1).split(",")) {
      text += "," + Math.round(c);
    }
    return text.substring(1);
  } else {
    return color;
  }
}

function formatColor(color) {
  if (color.includes(",")) {
    return "rgb(" + color.replace(" ", "") + ")";
  } else {
    return color;
  }
}

function setPresetJSON(preset) {  
  menuValues.presets.push(new MenuPreset(true, new Preset(preset.title, preset.settings, preset.objects, new Function(preset.func.substring(preset.func.indexOf("{") + 1, preset.func.length - 1)))));
}

async function readClipboard(func) {
  await navigator.clipboard.readText()
    .then(func)
    .catch((error) => {
      alert("Clipboard read access denied");
    });
}

async function writeClipboard(text) {
  await navigator.clipboard.writeText(text)
    .catch((error) => {
      alert("Clipboard write access denied");
    });
}

function drawBall(px, py, pa, size, color, ctx = ctxMain, lines = true) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  ctx.translate(px, py);
  ctx.scale(size / 100, size / 100);
  ctx.rotate(pa);
  ctx.fillStyle = color;
  
  ctx.beginPath();
  ctx.arc(0, 0, 50, 0, 2 * Math.PI);
  ctx.fill();
  
  if (lines) {
    ctx.lineWidth = 7.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#0000007f";
    ctx.beginPath();
    let sqrt3 = 15 * Math.sqrt(3);
    ctx.moveTo(0, 0);
    ctx.lineTo(30, 0);
    ctx.moveTo(0, 0);
    ctx.lineTo(-15, sqrt3);
    ctx.moveTo(0, 0);
    ctx.lineTo(-15, -sqrt3);
    ctx.stroke();
  }
}

function drawRectWall(x1, y1, x2, y2, size, color, ctx = ctxMain) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  ctx.translate(x1, y1);
  ctx.rotate(angle(x1, y1, x2, y2));
  ctx.scale(dist(x1, y1, x2, y2) / 100, size / 100);
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 100, 100);
}

function drawTriWall(x, y, color, ctx = ctxMain) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x[0], y[0]);
  for (let n = 1; n < x.length; n++) {
    ctx.lineTo(x[n], y[n]);
  }
  ctx.fill();
}

function drawCircleWall(x, y, r1, r2, a1, a2, color, ctx = ctxMain) {
  if (ctx == ctxMain) {
    scale();
  } else {
    ctx.resetTransform();
  }
  
  ctx.fillStyle = color;
  ctx.beginPath();
  a1 = Math.round(a1 / eps) * eps;
  a2 = Math.round(a2 / eps) * eps;
  let da = angMod2(a2 - a1);
  ctx.arc(x, y, r1, a1, a2, da >= Math.PI * 2);
  ctx.arc(x, y, r2, a2, a1, da < Math.PI * 2);
  ctx.fill();
}

function drawListWall(wList, color, ctx = ctxMain) {
  
  if (wList.length > 0) {
    if (ctx == ctxMain) {
      scale();
    } else {
      ctx.resetTransform();
    }
    ctx.fillStyle = color;
    
    let w;
    let pw = wList[0];
    for (let n = 1; n < wList.length; n++) {
      w = wList[n];
      
      ctx.beginPath();
      ctx.moveTo(pw.x[1], pw.y[1]);
      ctx.lineTo(pw.x[0], pw.y[0]);
      ctx.lineTo(pw.x[2], pw.y[2]);
      ctx.lineTo(w.x[2], w.y[2]);
      
      ctx.fill();
      
      pw = w;
    }
  }
  
}

function drawSpring(x1, y1, x2, y2, size, coils, thickness, color, ctx=ctxMain) {
  if (coils >= 1 && (x1 != x2 || y1 != y2)) {
    if (ctx == ctxMain) {
      scale();
    } else {
      ctx.resetTransform();
    }
    
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;
    ctx.lineCap = "but" + "t";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    
    let length = dist(x1, y1, x2, y2);
    let dxThick = (x2 - x1) * thickness / length / 2;
    let dyThick = (y2 - y1) * thickness / length / 2;
    let dx = (x2 - x1) * 2 / coils - dxThick;
    let dy = (y2 - y1) * 2 / coils - dyThick;
    let normalX = (y2 - y1) * size / length / 2;
    let normalY = (x1 - x2) * size / length / 2;
    let sx1 = x1 + dx / 4 + normalX;
    let sy1 = y1 + dy / 4 + normalY;
    let sx2 = x1 + dx * 3 / 4 - normalX;
    let sy2 = y1 + dy * 3 / 4 - normalY;
    
    for (let n = 1; n < coils; n += 2) {
      ctx.lineTo(sx1, sy1);
      sx1 += dxThick;
      sy1 += dyThick;
      ctx.lineTo(sx1, sy1);
      sx1 += dx;
      sy1 += dy;
      ctx.lineTo(sx2, sy2);
      sx2 += dxThick;
      sy2 += dyThick;
      ctx.lineTo(sx2, sy2);
      sx2 += dx;
      sy2 += dy;
    }
    
    if (coils % 2 == 1) {
      ctx.lineTo(sx1, sy1);
      sx1 += dxThick;
      sy1 += dyThick;
      ctx.lineTo(sx1, sy1);
    }
    
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
}

function Point(x, y) {
  this.objType = "point";
  this.x = x;
  this.y = y;
  
  this.getX = () => this.x;
  this.getY = () => this.y;
  this.getA = () => 0;
  
  this.move = function(dx, dy) {
    this.x += dx;
    this.y += dy;
  }
}

function Ball(px, py, pa, vx, vy, va, mass, size, moiCoef, drag0, drag1, drag2, movable, rotatable, color) {
  this.objType = "ball";
  
  this.px = px;
  this.py = py;
  this.pa = pa;
  this.vx = vx;
  this.vy = vy;
  this.va = va;
  this.mass = mass;
  this.size = size;
  this.moiCoef = moiCoef;
  this.drag0 = drag0;
  this.drag1 = drag1;
  this.drag2 = drag2;
  this.movable = movable;
  this.rotatable = rotatable;
  this.color = color;
  
  this.collided = [];
  this.ax = 0;
  this.ay = 0;
  this.aa = 0;
  
  this.show = function() {
    drawBall(this.px, this.py, this.pa, this.size, this.color);
  }
  
  this.getX = () => this.px;
  this.getY = () => this.py;
  this.getA = () => this.pa;
  
  this.move = function(dx, dy) {
    this.px += dx;
    this.py += dy;
  }
  
  this.update1 = function(dt) {
    //store previous
    this.fvx = this.vx;
    this.fvy = this.vy;
    this.fva = this.va;
    //acceleration
    this.accelerate();
  } //acceleration
  
  this.update2 = function(dt) {
    //move
    this.px += this.vx * dt + this.ax * dt * dt / 2;
    this.py += this.vy * dt + this.ay * dt * dt / 2;
    this.pa += this.va * dt + this.aa * dt * dt / 2;
    //accelerate
    this.vx += this.ax * dt;
    this.vy += this.ay * dt;
    this.va += this.aa * dt;
    this.drag(dt);
    //previous
    this.pvx = this.vx;
    this.pvy = this.vy;
    this.pva = this.va;
    //new
    this.collided = [];
    this.dpx = [];
    this.dpy = [];
    this.dpa = [];
    this.dvx = [];
    this.dvy = [];
    this.dva = [];
    this.bounceTotal = 0;
    this.bounceNormalX = 0;
    this.bounceNormalY = 0;
    this.bounceRest = 0;
    this.bounceFrict = 0;
  } //movement
  
  this.update3 = function(dt) {
      //balls
      if (collide) {
        for (b of balls) {
          if (b != this && (b != dragObj || dragMode == undefined) && !this.collided.includes(b)) {
            this.collideBall(b);
          }
        }
      }
      //walls
      for (w of walls) {
        if (w != dragObj || dragMode == undefined) {
          this.collideWall(w);
        }
      }
  } //collisions
  
  this.update4 = function(dt) {
    if (this.bounceTotal != 0) {
      let normalMag = Math.sqrt(this.bounceNormalX * this.bounceNormalX + this.bounceNormalY * this.bounceNormalY);
      normalMag = (normalMag == 0 ? 1 : normalMag);
      this.bounceNormalX /= normalMag;
      this.bounceNormalY /= normalMag;
      this.bounceRest /= this.bounceTotal;
      this.bounceFrict /= this.bounceTotal;
    }
    this.pvx = this.vx;
    this.pvy = this.vy;
    this.pva = this.va;
    this.ppx = this.px;
    this.ppy = this.py;
    this.ppa = this.pa;
    if (push) {
      let newN;
      newN = average(this.dpx);
      if (newN != null) {
        this.px += newN;
      }
      newN = average(this.dpy);
      if (newN != null) {
        this.py += newN;
      }
      newN = average(this.dpa);
      if (newN != null) {
        this.pa += newN;
      }
    }
    this.pe = 0;
    this.e = 0;
  } //apply pushes
  
  this.update5 = function(dt) {
    //potential
    if (this.ppx != this.px || this.ppy != this.py) {
      this.pe -= gx * this.ppx + gy * this.ppy;
      this.e -= gx * this.px + gy * this.py;
      if (G != 0 && this.movable) {
        for (b of balls) {
          if (this != b) {
            this.pe -= G * b.mass / dist(this.ppx, this.ppy, b.px, b.py);
            this.e -= G * b.mass / dist(this.px, this.py, b.px, b.py);
          }
        }
      }
      if (this.pe != this.e) {
        let ax = this.px - this.ppx;
        let ay = this.py - this.ppy;
        let a = ax * ax + ay * ay;
        let vDota = this.vx * ax + this.vy * ay;
        let t = ((vDota >= 0 ? 1 : -1) * Math.sqrt(Math.max(vDota * vDota + 2 * a * (this.pe - this.e), 0)) - vDota) / a;
        this.vx += ax * t;
        this.vy += ay * t;
      }
    }
    //set
    this.nvx = this.vx;
    this.nvy = this.vy;
    this.nva = this.va;
    this.npx = this.px;
    this.npy = this.py;
    this.npa = this.pa;
    this.vx = this.pvx;
    this.vy = this.pvy;
    this.va = this.pva;
    this.px = this.ppx;
    this.py = this.ppy;
    this.pa = this.ppa;
  } //account for potential
  
  this.update6 = function(dt) {
    if (push) {
      this.px = this.npx;
      this.py = this.npy;
      this.pa = this.npa;
    }
    this.vx = this.nvx;
    this.vy = this.nvy;
    this.va = this.nva;
  } //apply positions
  
  this.update7 = function(dt) {
    //balls
    for (let b of this.collided) {
      this.bounceBall(b);
    }
    //walls
    if (this.bounceTotal != 0) {
      this.bounceWall(this.bounceNormalX, this.bounceNormalY, this.bounceRest, this.bounceFrict);
    }
  } //calculate velocities
  
  this.update8 = function(dt) {
    //apply
    this.vx += sum(this.dvx);
    this.vy += sum(this.dvy);
    this.va += sum(this.dva);
    //reset
    this.collided = [];
    this.ax = 0;
    this.ay = 0;
    this.aa = 0;
  } //apply velocities
  
  this.accelerate = function() {
    //uniform gravity
    this.ax += gx;
    this.ay += gy;
    //object gravity
    if (G != 0) {
      for (b of balls) {
        if (b != this && (b != dragObj || dragMode == undefined) && !this.collided.includes(b)) {
          this.forceBall(b);
        }
      }
    }
  }
  
  this.drag = function(dt) {
    let rvx = this.vx - windVX;
    let rvy = this.vy - windVY;
    if ((rvx != 0 || rvy != 0) && (this.drag0 != 0 || this.drag1 != 0 || this.drag2 != 0)) {
      let vx = rvx + this.ax * dt;
      let vy = rvy + this.ay * dt;
      let vel = Math.sqrt(vx * vx + vy * vy);
      let mag = (this.drag0 / vel + this.drag1 + this.drag2 * vel) * dt / this.mass;
      if (mag < 1) {
        this.vx -= mag * vx;
        this.vy -= mag * vy;
      } else {
        this.vx = 0;
        this.vy = 0;
      }
    }
  }
  
  this.forceBall = function(b) {
    let distance = dist(this.px, this.py, b.px, b.py);
    let mag = G / distance ** 3;
    if (this.movable) {
      this.ax += mag * b.mass * (b.px - this.px);
      this.ay += mag * b.mass * (b.py - this.py);
    }
    if (b.movable) {
      b.ax += mag * this.mass * (this.px - b.px);
      b.ay += mag * this.mass * (this.py - b.py);
    }
    b.collided.push(this);
  } //ball-ball gravity
  
  this.addBounce = function(normalX, normalY, rest, frict, normalV) {
    let mag = normalV ?? this.vx * normalX + this.vy * normalY;
    if (mag <= eps * Math.sqrt(this.vx * this.vx + this.vy * this.vy)) {
      mag = Math.abs(mag);
      this.bounceTotal += mag;
      this.bounceNormalX += normalX * mag;
      this.bounceNormalY += normalY * mag;
      this.bounceRest += rest * mag;
      this.bounceFrict += frict * mag;
    }
  }
  
  this.bounceBall = function(b) {
    let pvDotp = (this.pvx - b.pvx) * (b.px - this.px) + (this.pvy - b.pvy) * (b.py - this.py);
    if (pvDotp >= -eps * Math.sqrt(this.vx * this.vx + this.vy * this.vy)) {
      let totalMass = (b.movable ? this.mass : 0) + (this.movable ? b.mass : 0);
      let this_mass = (totalMass == 0 ? 1 : this.mass);
      let b_mass = (totalMass == 0 ? 1 : b.mass);
      totalMass = (totalMass == 0 ? 2 : totalMass);
      let distance = dist(this.px, this.py, b.px, b.py);
      let vDotp = (this.vx - b.vx) * (b.px - this.px) + (this.vy - b.vy) * (b.py - this.py);
      let normalVelMag = vDotp * (1 + bRestCoef) / distance / totalMass;
      let normalVelAng = normalVelMag / distance;
      let normalVelX = normalVelAng * (b.px - this.px);
      let normalVelY = normalVelAng * (b.py - this.py);
      let force = Math.abs(pvDotp + vDotp * bRestCoef) / distance / totalMass;
      let fSideVel = ((this.fvx - b.fvx) * (this.py - b.py) + (this.fvy - b.fvy) * (b.px - this.px)) / distance + (this.fva * this.size + b.fva * b.size) / 2;
      let sideVel = ((this.vx - b.vx) * (this.py - b.py) + (this.vy - b.vy) * (b.px - this.px)) / distance + (this.va * this.size + b.va * b.size) / 2;
      let sideVelAng = sideVel / distance;
      let sideVelX = sideVelAng * (this.py - b.py);
      let sideVelY = sideVelAng * (b.px - this.px);
      let frictionVelMag = Math.sign(sideVel) * Math.min(Math.abs(sideVel) / (this.rotatable ? 1 + 1 / this.moiCoef : 1) / totalMass, (Math.abs(fSideVel) <= Math.abs(sideVel) * eps ? bSFrictCoef : bKFrictCoef) * Math.abs(force));
      let frictionVelAng = frictionVelMag / (sideVel == 0 ? Math.SQRT2 : sideVel);
      let frictionVelX = frictionVelAng * (sideVel == 0 ? 1 : sideVelX);
      let frictionVelY = frictionVelAng * (sideVel == 0 ? 1 : sideVelY);
      
      if (this.movable) {
        this.dvx.push(-b_mass * (normalVelX + frictionVelX));
        this.dvy.push(-b_mass * (normalVelY + frictionVelY));
      }
      if (this.rotatable) this.dva.push(-b_mass * 2 * frictionVelMag / this.size / this.moiCoef);
      if (b.movable) {
        b.dvx.push(this_mass * (normalVelX + frictionVelX));
        b.dvy.push(this_mass * (normalVelY + frictionVelY));
      }
      if (b.rotatable) b.dva.push(-this_mass * 2 * frictionVelMag / b.size / b.moiCoef);
    }
  }
  
  this.bounceWall = function(normalX, normalY, rest, frict) {
    let pNormalV = this.pvx * normalX + this.pvy * normalY;
    let normalV = this.vx * normalX + this.vy * normalY;
    let force = Math.abs(pNormalV + normalV * rest);
    let sideV = this.vx * normalY - this.vy * normalX;
    let fMax = force * frict;
    let fVal = (sideV + this.va * this.size / 2) / (this.rotatable ? 1 + 1 / this.moiCoef : 1);
    if (fMax < Math.abs(fVal)) {
      fVal = fMax * Math.sign(fVal);
    }
    if (this.movable) {
      this.dvx.push(-(1 + rest) * normalV * normalX - fVal * normalY);
      this.dvy.push(-(1 + rest) * normalV * normalY + fVal * normalX);
    }
    if (this.rotatable) this.dva.push(-2 * fVal / this.size / this.moiCoef);
    
    let vx = this.vx;
    let vy = this.vy;
    let va = this.va;
    this.vx += this.dvx.at(-1);
    this.vy += this.dvy.at(-1);
    this.va += this.dva.at(-1);
    this.vx = vx;
    this.vy = vy;
    this.va = va;
  }
  
  this.collideBall = function(b) {
    let sqDistance = sqdist(this.px, this.py, b.px, b.py);
    if ((this.size + b.size) * (this.size + b.size) > 4 * sqDistance) {
      let totalMass = (b.movable ? this.mass : 0) + (this.movable ? b.mass : 0);
      let this_mass = (totalMass == 0 ? 1 : this.mass);
      let b_mass = (totalMass == 0 ? 1 : b.mass);
      totalMass = (totalMass == 0 ? 2 : totalMass);
      let curDist = Math.sqrt(sqDistance);
      let targetDist = /*(1 + eps) * */(this.size + b.size) / 2;
      let pushFactor = (targetDist - curDist) / curDist * b_mass / totalMass;
      let bPushFactor = (targetDist - curDist) / curDist * this_mass / totalMass;
      if (this.movable) {
        this.dpx.push(-(b.px - this.px) * pushFactor);
        this.dpy.push(-(b.py - this.py) * pushFactor);
      }
      if (this.rotatable) {
        b.dpx.push(-(this.px - b.px) * bPushFactor);
        b.dpy.push(-(this.py - b.py) * bPushFactor);
      }
      
      b.collided.push(this);
    }
  }
  
  this.collideWall = function(w) {
      switch (w.objType) {
          case "rectWall":
              this.collideRectWall(w);
              break;
          case "triWall":
              this.collideTriWall(w);
              break;
          case "circleWall":
              this.collideCircleWall(w);
              break;
          case "listWall":
              for (w1 of w.walls) {
                  this.collideWall(w1);
              }
              break;
      }
  }
  
  this.collideRectWall = function(w) {
      
      let dist1 = (this.px - w.centerX) * w.normalX1 + (this.py - w.centerY) * w.normalY1;
      let dist2 = (this.px - w.centerX) * w.normalX2 + (this.py - w.centerY) * w.normalY2;
      let edgeDist1 = 2 * Math.abs(dist1) - w.size1;
      let edgeDist2 = 2 * Math.abs(dist2) - w.size2;
      let effSize1 = (edgeDist2 > 0 && edgeDist2 < this.size ? Math.sqrt(this.size * this.size - edgeDist2 * edgeDist2) : this.size);
      let effSize2 = (edgeDist1 > 0 && edgeDist1 < this.size ? Math.sqrt(this.size * this.size - edgeDist1 * edgeDist1) : this.size);
      if (edgeDist1 <= effSize1 && edgeDist2 <= effSize2) {
          let v1 = this.vx * w.normalX1 + this.vy * w.normalY1;
          let v2 = this.vx * w.normalX2 + this.vy * w.normalY2;
          let pxCol;
          let pyCol;
          if (this.movable) {
            if (effSize1 - edgeDist1 <= effSize2 - edgeDist2) {
                let pushDist = /*(1 + eps) * */((effSize1 + w.size1) / 2 - Math.abs(dist1)) * Math.sign(dist1);
                pxCol = pushDist * w.normalX1;
                pyCol = pushDist * w.normalY1;
                this.dpx.push(pxCol);
                this.dpy.push(pyCol);
                pxCol += this.px;
                pyCol += this.py;
            } else {
                let pushDist = ((effSize2 + w.size2) / 2 - Math.abs(dist2)) * Math.sign(dist2);
                pxCol = pushDist * w.normalX2;
                pyCol = pushDist * w.normalY2;
                this.dpx.push(pxCol);
                this.dpy.push(pyCol);
                pxCol += this.px;
                pyCol += this.py;
            }
          }
          dist1 = (pxCol - w.centerX) * w.normalX1 + (pyCol - w.centerY) * w.normalY1;
          dist2 = (pxCol - w.centerX) * w.normalX2 + (pyCol - w.centerY) * w.normalY2;
          let normalX;
          let normalY;
          let fv;
          if (2 * Math.abs(dist2) < w.size2) {
            let normalX = w.normalX1 * Math.sign(dist1);
            let normalY = w.normalY1 * Math.sign(dist1);
            let fv = Math.abs(this.fvx * normalY - this.fvy * normalX + this.fva * this.size / 2);
            let sv = Math.abs(v2 * Math.sign(dist1) + this.va * this.size / 2);
            this.addBounce(normalX, normalY, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict), v1 * Math.sign(dist1));
          } else if (2 * Math.abs(dist1) < w.size1) {
            let normalX = w.normalX2 * Math.sign(dist2);
            let normalY = w.normalY2 * Math.sign(dist2);
            let fv = Math.abs(this.fvx * normalY - this.fvy * normalX + this.fva * this.size / 2);
            let sv = Math.abs(v1 * Math.sign(dist2) + this.va * this.size / 2);
            this.addBounce(normalX, normalY, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict), v2 * Math.sign(dist2));
          } else {
            let edgeDist1 = dist1 - Math.sign(dist1) * w.size1 / 2;
            let edgeDist2 = dist2 - Math.sign(dist2) * w.size2 / 2;
            let distance = Math.sqrt(edgeDist1 * edgeDist1 + edgeDist2 * edgeDist2);
            let normalX = (edgeDist1 * w.normalX1 + edgeDist2 * w.normalX2) / distance;
            let normalY = (edgeDist1 * w.normalY1 + edgeDist2 * w.normalY2) / distance;
            let fv = Math.abs(this.fvx * normalY - this.fvy * normalX + this.fva * this.size / 2);
            let sv = Math.abs(this.vx * normalY - this.vy * normalX + this.va * this.size / 2);
            this.addBounce(normalX, normalY, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict));
          }
      }
      
  }
  
  this.collideTriWall = function(w) {
      
      let sideDist = [];
      let normalDist = [];
      let sides = false;
      let inWall = true;
      for (let n = 0; n < w.num; n++) {
        sideDist.push(Math.abs((this.px - w.midX[n]) * w.sideX[n] + (this.py - w.midY[n]) * w.sideY[n]));
        normalDist.push((this.px - w.x[n]) * w.normalX[n] + (this.py - w.y[n]) * w.normalY[n]);
        sides = (Math.abs(2 * normalDist[n]) <= this.size && 2 * sideDist[n] <= w.size[n] ? true : sides)
        inWall = (normalDist[n] > 0 ? false : inWall)
      }
      
      let vertex;
      if (!(sides || inWall)) {
        let vertexSqdist;
        let bestSqdist = Number.POSITIVE_INFINITY;
        for (let n = 0; n < w.num; n++) {
          vertexSqdist = sqdist(this.px, this.py, w.x[n], w.y[n])
          if (4 * vertexSqdist <= this.size * this.size && vertexSqdist < bestSqdist) {
            vertex = n;
            bestSqdist = vertexSqdist;
          }
        }
      }
      
      if (sides || inWall || vertex != undefined) {
        let side = 0;
        for (let n = 1; n < w.num; n++) {
          if (normalDist[n] > normalDist[side]) {
            side = n;
          }
        }
        
        let pushDist = /*(1 + eps) * */((vertex == undefined ? this.size : Math.sqrt(this.size * this.size - (2 * sideDist[side] - w.size[side]) ** 2)) / 2 - normalDist[side]);
        let pxCol = pushDist * w.normalX[side];
        let pyCol = pushDist * w.normalY[side];
        if (this.movable) {
          this.dpx.push(pxCol);
          this.dpy.push(pyCol);
        }
        pxCol += this.px;
        pyCol += this.py;
        
        let sideX;
        let sideY;
        let normalX;
        let normalY;
        if (vertex == undefined) {
          sideX = w.sideX[side];
          sideY = w.sideY[side];
          normalX = w.normalX[side];
          normalY = w.normalY[side];
        } else {
          let distance = dist(w.x[vertex], w.y[vertex], pxCol, pyCol);
          normalX = (pxCol - w.x[vertex]) / distance;
          normalY = (pyCol - w.y[vertex]) / distance;
          sideX = normalY;
          sideY = -normalX;
        }
        let fv = Math.abs(this.fvx * sideX + this.fvy * sideY + this.fva * this.size / 2);
        let sv = Math.abs(this.vx * sideX + this.vy * sideY + this.va * this.size / 2);
        this.addBounce(normalX, normalY, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict));
      }
      
  }
  
  this.collideCircleWall = function(w) {
      let distance = dist(w.x, w.y, this.px, this.py);
      let dist1 = distance - w.r1 + this.size / 2;
      let dist2 = w.r2 - distance + this.size / 2;
      
      if (dist1 >= 0 && dist2 >= 0) {
        let ang = angle(w.x, w.y, this.px, this.py);
        let distA1 = (this.px - w.x) * w.ax1 + (this.py - w.y) * w.ay1;
        let distA2 = (this.px - w.x) * w.ax2 + (this.py - w.y) * w.ay2;
        let offsetA1 = Math.abs(distA1 * 2 - w.r1 - w.r2) + w.r1 - w.r2;
        let offsetA2 = Math.abs(distA2 * 2 - w.r1 - w.r2) + w.r1 - w.r2;
        let effSize1 = (w.r1 <= distA1 && distA1 <= w.r2 ? this.size / 2 : (offsetA1 < this.size ? Math.sqrt(this.size * this.size - offsetA1 * offsetA1) / 2 : 0));
        let effSize2 = (w.r1 <= distA2 && distA2 <= w.r2 ? this.size / 2 : (offsetA2 < this.size ? Math.sqrt(this.size * this.size - offsetA2 * offsetA2) / 2 : 0));
        let offset1 = (this.px - w.x) * w.normalX1 + (this.py - w.y) * w.normalY1;
        let offset2 = (this.px - w.x) * w.normalX2 + (this.py - w.y) * w.normalY2;
        let angDist1 = angMod(ang - w.a1);
        let angDist2 = angMod(w.a2 - ang);
        let pxCol;
        let pyCol;
        
        if (angMod(w.a2 - w.a2) == 0 || angDist1 + angDist2 <= Math.PI * 2 || Math.abs(offset1) <= effSize1 || Math.abs(offset2) <= effSize2) {
            let v1;
            let v2;
            let fMax;
            let fVal;
            let normalX;
            let normalY;
            let side = false;
            
            switch (Math.min(dist1, dist2, Math.abs(effSize1 - offset1), Math.abs(effSize2 - offset2))) {
                case dist1:
                    side = true;
                case dist2:
                    normalX = (this.px - w.x) / distance * (side ? -1 : 1);
                    normalY = (this.py - w.y) / distance * (side ? -1 : 1);
                    pxCol = (side ? dist1 : dist2) * normalX;
                    pyCol = (side ? dist1 : dist2) * normalY;
                    if (this.movable) {
                      this.dpx.push(pxCol);
                      this.dpy.push(pyCol);
                    }
                    pxCol += this.px;
                    pyCol += this.py;
                    break;
                case Math.abs(effSize1 - offset1):
                    pxCol = Math.abs(effSize1 - offset1) * w.normalX1;
                    pyCol = Math.abs(effSize1 - offset1) * w.normalY1;
                    if (this.movable) {
                      this.dpx.push(pxCol);
                      this.dpy.push(pyCol);
                    }
                    pxCol += this.px;
                    pyCol += this.py;
                    break;
                case Math.abs(effSize2 - offset2):
                    pxCol = Math.abs(effSize2 - offset2) * w.normalX2;
                    pyCol = Math.abs(effSize2 - offset2) * w.normalY2;
                    if (this.movable) {
                      this.dpx.push(pxCol);
                      this.dpy.push(pyCol);
                    }
                    pxCol += this.px;
                    pyCol += this.py;
                    break;
            }
            distance = dist(w.x, w.y, pxCol, pyCol);
            ang = angle(w.x, w.y, pxCol, pyCol);
            offset1 = (pxCol - w.x) * w.normalX1 + (pyCol - w.y) * w.normalY1;
            offset2 = (pxCol - w.x) * w.normalX2 + (pyCol - w.y) * w.normalY2;
            if (distance < w.r1 - this.size / 2 + eps || distance > w.r2 + this.size / 2 - eps) {
              let fv = Math.abs(this.fvx * normalY - this.fvy * normalX + this.fva * this.size / 2);
              let sv = Math.abs(this.vx * normalY - this.vy * normalX + this.va * this.size / 2);
              this.addBounce(normalX, normalY, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict));
            } else if (Math.abs(offset1 * 2 - this.size) <= eps || Math.abs(offset2 * 2 - this.size) <= eps) {
                if (Math.abs(Math.PI - angDist1) >= Math.abs(Math.PI - angDist2)) {
                  let fv = Math.abs(this.fvx * w.normalY1 - this.fvy * w.normalX1 + this.fva * this.size / 2);
                  let sv = Math.abs(this.vx * w.normalY1 - this.vy * w.normalX1 + this.va * this.size / 2);
                  this.addBounce(w.normalX1, w.normalY1, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict));
                } else {
                  let fv = Math.abs(this.fvx * w.normalY2 - this.fvy * w.normalX2 + this.fva * this.size / 2);
                  let sv = Math.abs(this.vx * w.normalY2 - this.vy * w.normalX2 + this.va * this.size / 2);
                  this.addBounce(w.normalX2, w.normalY2, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict));
                }
            } else {
              let r = (2 * distance < w.r1 + w.r2 ? w.r1 : w.r2);
              let ax = (Math.abs(effSize1 - offset1) <= Math.abs(effSize2 - offset2) ? w.ax1 : w.ax2);
              let ay = (Math.abs(effSize1 - offset1) <= Math.abs(effSize2 - offset2) ? w.ay1 : w.ay2);
              let distX = pxCol - w.x - r * ax;
              let distY = pyCol - w.y - r * ay;
              let distMag = Math.sqrt(distX * distX + distY * distY);
              let normalX = distX / distMag;
              let normalY = distY / distMag;
              let fv = Math.abs(this.fvx * normalY - this.fvy * normalX + this.fva * this.size / 2);
              let sv = Math.abs(this.vx * normalY - this.vy * normalX + this.va * this.size / 2);
              this.addBounce(normalX, normalY, w.wRest, (fv <= sv * eps ? w.wSFrict : w.wKFrict));
            }
        }
      }
  }
  
  this.containsPoint = function(x, y) {
      return sqdist(this.px, this.py, x, y) * 4 <= this.size * this.size;
  }
  
  this.setMOI = function(moi) {
    this.moi = moi;
    this.moiCoef = 4 * this.moi / this.mass / this.size ** 2;
  }
  
  this.setMOICoef = function(moiCoef) {
    this.moiCoef = moiCoef;
    this.updateMOI();
  }
  
  this.updateMOI = function() {
    this.moi = this.moiCoef * this.mass * this.size * this.size / 4;
  }
  
  this.setMOICoef(moiCoef);
}

function RectWall(x1, y1, x2, y2, size, wRest, wSFrict, wKFrict, color) {
    this.objType = "rectWall";
    
    this.x1 = x1;
    this.y1 = y1;
    this.x2 = x2;
    this.y2 = y2;
    this.size = size;
    this.wRest = wRest;
    this.wSFrict = wSFrict;
    this.wKFrict = wKFrict;
    this.color = color;
    
    this.setDim = function() {
      this.size1 = Math.abs(this.size);
      this.size2 = dist(this.x1, this.y1, this.x2, this.y2);
      this.normalX1 = (this.y1 - this.y2) / this.size2;
      this.normalY1 = (this.x2 - this.x1) / this.size2;
      this.normalX2 = this.normalY1;
      this.normalY2 = -this.normalX1;
      this.centerX = (this.x1 + this.x2 + this.normalX1 * this.size) / 2;
      this.centerY = (this.y1 + this.y2 + this.normalY1 * this.size) / 2;
      this.angle = angle(this.x1, this.y1, this.x2, this.y2);
      
      this.offsetX = 0;
      this.offsetY = 0;
      this.offsetSize = Math.max(Math.abs(this.x2 - this.x1) + Math.abs(this.size1 * this.normalX1), Math.abs(this.y2 - this.y1) + Math.abs(this.size1 * this.normalY1));
    }
    
    this.setDim();
    
    this.show = function() {
        drawRectWall(this.x1, this.y1, this.x2, this.y2, this.size, this.color);
    }
  
    this.getX = () => this.centerX;
    this.getY = () => this.centerY;
    this.getA = () => this.angle;
    
    this.containsPoint = function(x, y) {
        let dist1 = (this.centerX - x) * this.normalX1 + (this.centerY - y) * this.normalY1;
        let dist2 = (this.centerX - x) * this.normalX2 + (this.centerY - y) * this.normalY2;
        return Math.abs(dist1) * 2 <= this.size1 && Math.abs(dist2) * 2 <= this.size2;
    }
    
    this.move = function(dx, dy) {
        this.x1 += dx;
        this.y1 += dy;
        this.x2 += dx;
        this.y2 += dy;
        this.centerX += dx;
        this.centerY += dy;
    }
    
    this.rotate = function(da) {
      let dax = Math.cos(da);
      let day = Math.sin(da);
      let normalX1 = this.normalX1 * dax - this.normalY1 * day;
      let normalY1 = this.normalX1 * day + this.normalY1 * dax;
      let normalX2 = normalY1;
      let normalY2 = -normalX1;
      this.normalX1 = normalX1;
      this.normalY1 = normalY1;
      this.normalX2 = normalX2;
      this.normalY2 = normalY2;
      this.x1 = this.centerX - (normalX1 * this.size + normalY1 * this.size2) / 2;
      this.y1 = this.centerY - (normalY1 * this.size - normalX1 * this.size2) / 2;
      this.x2 = this.centerX - (normalX1 * this.size - normalY1 * this.size2) / 2;
      this.y2 = this.centerY - (normalY1 * this.size + normalX1 * this.size2) / 2;
      this.offsetSize = Math.max(Math.abs(this.x2 - this.x1) + Math.abs(this.size1 * this.normalX1), Math.abs(this.y2 - this.y1) + Math.abs(this.size1 * this.normalY1));
      this.angle = angle(this.x1, this.y1, this.x2, this.y2);
    }
}

function TriWall(x, y, wRest, wSFrict, wKFrict, color) {
  this.objType = "triWall";
  
  this.x = x;
  this.y = y;
  this.wRest = wRest;
  this.wSFrict = wSFrict;
  this.wKFrict = wKFrict;
  this.color = color;
  
  this.setDim = function() {
    this.num = x.length;
    this.centerX = average(this.x);
    this.centerY = average(this.y);
    this.angle = angle(this.centerX, this.centerY, this.x[0], this.y[0]);
    
    this.offsetX = (Math.max(...this.x) + Math.min(...this.x)) / 2 - this.centerX;
    this.offsetY = (Math.max(...this.y) + Math.min(...this.y)) / 2 - this.centerY;
    this.offsetSize = Math.max(Math.max(...this.x) - Math.min(...this.x), Math.max(...this.y) - Math.min(...this.y));
    
    this.dir = ((this.x[1] - this.x[0]) * (this.y[2] - this.y[1]) - (this.x[2] - this.x[1]) * (this.y[1] - this.y[0]) > 0 ? 1 : -1);
    this.size = [];
    this.midX = [];
    this.midY = [];
    this.sideX = [];
    this.sideY = [];
    this.normalX = [];
    this.normalY = [];
    for (let n = 0; n < this.num; n++) {
      this.size.push(dist(this.x[n], this.y[n], this.x[(n + 1) % this.num], this.y[(n + 1) % this.num]));
      this.midX.push((this.x[n] + this.x[(n + 1) % this.num]) / 2);
      this.midY.push((this.y[n] + this.y[(n + 1) % this.num]) / 2);
      this.sideX.push(this.dir * (this.x[n] - this.x[(n + 1) % this.num]) / this.size[n]);
      this.sideY.push(this.dir * (this.y[n] - this.y[(n + 1) % this.num]) / this.size[n]);
      this.normalX.push(-this.sideY[n]);
      this.normalY.push(this.sideX[n]);
    }
  }
  
  this.setDim();
  
  this.show = function() {
    drawTriWall(this.x, this.y, this.color);
  }
  
  this.getX = () => this.centerX;
  this.getY = () => this.centerY;
  this.getA = () => this.angle;
  
  this.containsPoint = function(x, y) {
    for (let n = 0; n < this.num; n++) {
      if ((x - this.x[n]) * this.normalX[n] + (y - this.y[n]) * this.normalY[n] > 0) {
        return false;
      }
    }
    return true;
  }
  
  this.move = function(dx, dy) {
    for (let n = 0; n < this.num; n++) {
      this.x[n] += dx;
      this.y[n] += dy;
      this.midX[n] += dx;
      this.midY[n] += dy;
    }
    this.centerX += dx;
    this.centerY += dy;
  }
  
  this.rotate = function(da) {
    let dax = Math.cos(da);
    let day = Math.sin(da);
    let newX;
    let newY;
    for (let n = 0; n < this.num; n++) {
      newX = this.sideX[n] * dax - this.sideY[n] * day;
      newY = this.sideX[n] * day + this.sideY[n] * dax;
      this.sideX[n] = newX;
      this.sideY[n] = newY;
      newX = this.normalX[n] * dax - this.normalY[n] * day;
      newY = this.normalX[n] * day + this.normalY[n] * dax;
      this.normalX[n] = newX;
      this.normalY[n] = newY;
    }
    for (let n = 0; n < this.num; n++) {
      newX = (this.x[n] - this.centerX) * dax - (this.y[n] - this.centerY) * day + this.centerX;
      newY = (this.x[n] - this.centerX) * day + (this.y[n] - this.centerY) * dax + this.centerY;
      this.x[n] = newX;
      this.y[n] = newY;
      newX = (this.midX[n] - this.centerX) * dax - (this.midY[n] - this.centerY) * day + this.centerX;
      newY = (this.midX[n] - this.centerX) * day + (this.midY[n] - this.centerY) * dax + this.centerY;
      this.midX[n] = newX;
      this.midY[n] = newY;
    }
    this.angle += da;
    
    this.offsetX = (Math.max(...this.x) + Math.min(...this.x)) / 2 - this.centerX;
    this.offsetY = (Math.max(...this.y) + Math.min(...this.y)) / 2 - this.centerY;
    this.offsetSize = Math.max(Math.max(...this.x) - Math.min(...this.x), Math.max(...this.y) - Math.min(...this.y));
  }
}

function CircleWall(x, y, r1, r2, a1, a2, wRest, wSFrict, wKFrict, color) {
    this.objType = "circleWall";
    
    this.x = x;
    this.y = y;
    this.radius1 = r1;
    this.radius2 = r2;
    this.angle1 = a1;
    this.angle2 = a2;
    this.wRest = wRest;
    this.wSFrict = wSFrict;
    this.wKFrict = wKFrict;
    this.color = color;
    
    this.setDim = function() {
      this.r1 = Math.min(this.r1 ?? this.radius1, this.r2 ?? this.radius2);
      this.r2 = Math.max(this.r1 ?? this.radius1, this.r2 ?? this.radius2);
      this.a1 = Math.round(angMod2(this.a1 ?? this.angle1) / eps) * eps;
      this.a2 = Math.round(angMod2(this.a2 ?? this.angle2) / eps) * eps;
      let da = angMod2(this.a2 - this.a1);
      if (da >= Math.PI * 2 && da < Math.PI * 6) {
        let a1 = this.a1;
        this.a1 = this.a2;
        this.a2 = a1;
      }
      
      this.ax1 = Math.cos(this.a1);
      this.ay1 = Math.sin(this.a1);
      this.ax2 = Math.cos(this.a2);
      this.ay2 = Math.sin(this.a2);
      this.normalX1 = this.ay1;
      this.normalY1 = -this.ax1;
      this.normalX2 = -this.ay2;
      this.normalY2 = this.ax2;
      this.centerX = this.x;
      this.centerY = this.y;
      this.angle = this.a1;
      
      let minX;
      let maxX;
      if (this.ax1 <= this.ax2) {
        minX = this.containsAngle(Math.PI) ? -this.r2 : this.ax1 * (this.ax1 >= 0 ? this.r1 : this.r2);
        maxX = this.containsAngle(0) ? this.r2 : this.ax2 * (this.ax2 <= 0 ? this.r1 : this.r2);
      } else {
        minX = this.containsAngle(Math.PI) ? -this.r2 : this.ax2 * (this.ax2 >= 0 ? this.r1 : this.r2);
        maxX = this.containsAngle(0) ? this.r2 : this.ax1 * (this.ax1 <= 0 ? this.r1 : this.r2);
      }
      let minY;
      let maxY;
      if (this.ay1 <= this.ay2) {
        minY = this.containsAngle(Math.PI * 3 / 2) ? -this.r2 : this.ay1 * (this.ay1 >= 0 ? this.r1 : this.r2);
        maxY = this.containsAngle(Math.PI / 2) ? this.r2 : this.ay2 * (this.ay2 <= 0 ? this.r1 : this.r2);
      } else {
        minY = this.containsAngle(Math.PI * 3 / 2) ? -this.r2 : this.ay2 * (this.ay2 >= 0 ? this.r1 : this.r2);
        maxY = this.containsAngle(Math.PI / 2) ? this.r2 : this.ay1 * (this.ay1 <= 0 ? this.r1 : this.r2);
      }
      
      this.offsetX = (minX + maxX) / 2;
      this.offsetY = (minY + maxY) / 2;
      this.offsetSize = Math.max(maxX - minX, maxY - minY);
    }
    
    this.show = function() {
      drawCircleWall(this.x, this.y, this.r1, this.r2, this.a1, this.a2, this.color);
    }
  
    this.getX = () => this.centerX;
    this.getY = () => this.centerY;
    this.getA = () => this.angle;
    
    this.containsAngle = function(a) {
      let angDist1 = angMod2(a - this.a1) + angMod2(this.a2 - a);
      let angDist2 = angMod2(a - this.a1 + Math.PI * 2) + angMod2(this.a2 - a + Math.PI * 2);
      return angDist1 <= Math.PI * 2 || angDist1 > Math.PI * 6 || angDist2 <= Math.PI * 2 || angDist2 > Math.PI * 6;
    }
    
    this.containsPoint = function(x, y) {
      let distance = dist(this.x, this.y, x, y);
      return this.r1 <= distance && distance <= this.r2 && this.containsAngle(angMod(angle(this.x, this.y, x, y)));
    }
    
    this.move = function(dx, dy) {
        this.x += dx;
        this.y += dy;
        this.centerX += dx;
        this.centerY += dy;
    }
    
    this.rotate = function(da) {
      this.a1 = angMod2(this.a1 + da);
      this.a2 = angMod2(this.a2 + da);
      this.setDim();
    }
    
    this.setDim();
}

function ListWall(wList) {
    this.objType = "listWall";
    
    this.walls = wList;
    this.wRest = this.walls[0].wRest;
    this.wSFrict = this.walls[0].wSFrict;
    this.wKFrict = this.walls[0].wKFrict;
    this.color = this.walls[0].color;
    
    this.setDim = function() {
      let num = 0;
      let totalX = 0;
      let totalY = 0;
      let maxX = Number.NEGATIVE_INFINITY;
      let minX = Number.POSITIVE_INFINITY;
      let maxY = Number.NEGATIVE_INFINITY;
      let minY = Number.POSITIVE_INFINITY;
      for (let w of this.walls) {
        num += 1;
        totalX += w.centerX;
        totalY += w.centerY;
        for (let n = 0; n < w.num; n++) {
          if (w.x[n] > maxX) {
            maxX = w.x[n];
          }
          if (w.x[n] < minX) {
            minX = w.x[n];
          }
          if (w.y[n] > maxY) {
            maxY = w.y[n];
          }
          if (w.y[n] < minY) {
            minY = w.y[n];
          }
        }
      }
      if (num == 0) {
        this.centerX = 0;
        this.centerY = 0;
      } else {
        this.centerX = totalX / num;
        this.centerY = totalY / num;
      }
      this.offsetX = (maxX + minX) / 2 - this.centerX;
      this.offsetY = (maxY + minY) / 2 - this.centerY;
      this.offsetSize = Math.max(maxX - minX, maxY - minY);
      this.angle = 0;
    }
    
    this.setDim();
    
    this.show = function() {
      drawListWall(this.walls, this.color);
    }
  
    this.getX = () => this.centerX;
    this.getY = () => this.centerY;
    this.getA = () => this.angle;
    
    this.containsPoint = function(x, y) {
        for (t of this.walls) {
            if (t.containsPoint(x, y)) {
                return true;
            }
        }
        return false;
    }
    
    this.move = function(dx, dy) {
        this.centerX += dx;
        this.centerY += dy;
        for (w of this.walls) {
            w.move(dx, dy);
        }
    }
    
    this.rotate = function(da) {
      let maxX = Number.NEGATIVE_INFINITY;
      let minX = Number.POSITIVE_INFINITY;
      let maxY = Number.NEGATIVE_INFINITY;
      let minY = Number.POSITIVE_INFINITY;
      this.angle += da;
      for (let w of this.walls) {
        w.rotate(da);
        let dax = Math.cos(da);
        let day = Math.sin(da);
        w.move((w.centerX - this.centerX) * (dax - 1) - (w.centerY - this.centerY) * day, (w.centerX - this.centerX) * day + (w.centerY - this.centerY) * (dax - 1));
        for (let n = 0; n < w.num; n++) {
          if (w.x[n] > maxX) {
            maxX = w.x[n];
          }
          if (w.x[n] < minX) {
            minX = w.x[n];
          }
          if (w.y[n] > maxY) {
            maxY = w.y[n];
          }
          if (w.y[n] < minY) {
            minY = w.y[n];
          }
        }
      }
      this.offsetX = (maxX + minX) / 2 - this.centerX;
      this.offsetY = (maxY + minY) / 2 - this.centerY;
      this.offsetSize = Math.max(maxX - minX, maxY - minY);
    }
    
    this.setWRest = function(wRest) {
      this.wRest = wRest;
      for (let w of this.walls) {
        w.wRest = wRest;
      }
    }
    
    this.setWSFrict = function(wSFrict) {
      this.wSFrict = wSFrict;
      for (let w of this.walls) {
        w.wSFrict = wSFrict;
      }
    }
    
    this.setWKFrict = function(wKFrict) {
      this.wKFrict = wKFrict;
      for (let w of this.walls) {
        w.wKFrict = wKFrict;
      }
    }
    
    this.setColor = function(color) {
      this.color = color;
      for (let w of this.walls) {
        w.color = color;
      }
    }
}

function Spring(obj1, obj2, dx1, dy1, dx2, dy2, equilibrium, k, size, coils, thickness, color) {
  this.objType = "spring";
  
  this.obj1 = obj1;
  this.obj2 = obj2;
  this.dx1 = dx1;
  this.dy1 = dy1;
  this.dx2 = dx2;
  this.dy2 = dy2;
  this.equilibrium = equilibrium;
  this.k = k;
  this.size = size;
  this.coils = coils;
  this.thickness = thickness;
  this.color = color;
  
  this.getPos1 = function(x, y, a) {
    a = a ?? this.obj1.getA();
    let ax = Math.cos(a);
    let ay = Math.sin(a);
    return [(x ?? this.obj1.getX()) + this.dx1 * ax - this.dy1 * ay, (y ?? this.obj1.getY()) + this.dx1 * ay + this.dy1 * ax];
  }
  
  this.getPos2 = function(x, y, a) {
    a = a ?? this.obj2.getA();
    let ax = Math.cos(a);
    let ay = Math.sin(a);
    return [(x ?? this.obj2.getX()) + this.dx2 * ax - this.dy2 * ay, (y ?? this.obj2.getY()) + this.dx2 * ay + this.dy2 * ax];
  }
  
  this.setVars = function() {
    let p1 = this.getPos1();
    let p2 = this.getPos2();
    let length = dist(...p1, ...p2);
    
    this.centerX = (p1[0] + p2[0]) / 2;
    this.centerY = (p1[1] + p2[1]) / 2;
    this.offsetX = 0;
    this.offsetY = 0;
    this.offsetSize = Math.max(Math.abs(p2[0] - p1[0]) + Math.abs(this.size * (p2[1] - p1[1]) / length), Math.abs(p2[1] - p1[1]) + Math.abs(this.size * (p2[0] - p1[0]) / length));
  }
  
  this.setVars();
  
  this.show = function() {
    drawSpring(...this.getPos1(), ...this.getPos2(), this.size, this.coils, this.thickness, this.color);
  }
  
  this.getX = () => (this.getPos1()[0] + this.getPos2()[0]) / 2;
  this.getY = () => (this.getPos1()[1] + this.getPos2()[1]) / 2;
  this.getA = () => angle(...this.getPos1(), ...this.getPos2());
  
  this.pointifyObj1 = function() {
    this.obj1 = new Point(...this.getPos1());
    this.dx1 = 0;
    this.dy1 = 0;
  }
  
  this.pointifyObj2 = function() {
    this.obj2 = new Point(...this.getPos2());
    this.dx2 = 0;
    this.dy2 = 0;
  }
  
  this.force = function() {
    let p1 = this.getPos1();
    let p2 = this.getPos2();
    let length = dist(...p1, ...p2);
    let force = this.k * (1 - this.equilibrium / length);
    let fx = force * (p2[0] - p1[0]);
    let fy = force * (p2[1] - p1[1]);
    if (this.obj1.objType == "ball") {
      if (this.obj1.movable) this.obj1.ax += fx / this.obj1.mass;
      if (this.obj1.movable) this.obj1.ay += fy / this.obj1.mass;
      if (this.obj1.rotatable) this.obj1.aa -= (fx * (p1[1] - this.obj1.getY()) - fy * (p1[0] - this.obj1.getX())) / this.obj1.moi;
    }
    if (this.obj2.objType == "ball") {
      if (this.obj2.movable) this.obj2.ax -= fx / this.obj2.mass;
      if (this.obj2.movable) this.obj2.ay -= fy / this.obj2.mass;
      if (this.obj2.rotatable) this.obj2.aa += (fx * (p2[1] - this.obj2.getY()) - fy * (p2[0] - this.obj2.getX())) / this.obj2.moi;
    }
  }
  
  this.getEnergies = function() {
    let p1 = this.obj1.objType == "ball" ? this.getPos1(this.obj1.px, this.obj1.py, this.obj1.pa) : this.getPos1();
    let p2 = this.obj2.objType == "ball" ? this.getPos1(this.obj2.px, this.obj2.py, this.obj2.pa) : this.getPos2();
    let e = this.getEnergy(...p1, ...p2);
    if (this.obj1.objType == "ball") {
      this.obj1.pe += this.getEnergy(...this.getPos1(this.obj1.ppx, this.obj1.ppy, this.obj1.ppa), ...p2);
      this.obj1.e += e;
    }
    if (this.obj2.objType == "ball") {
      this.obj2.pe += this.getEnergy(...p1, ...this.getPos1(this.obj2.ppx, this.obj2.ppy, this.obj2.ppa));
      this.obj2.e += e;
    }
  }
  
  this.getEnergy = (x1, y1, x2, y2) => this.k * (dist(...this.getPos1(), ...this.getPos2()) - this.equilibrium) ** 2 / 2
  
  this.containsPoint = function(x, y) {
    let p1 = this.getPos1();
    let p2 = this.getPos2();
    let length = dist(...p1, ...p2);
    let dist1 = (x - p1[0]) * (p2[0] - p1[0]) + (y - p1[1]) * (p2[1] - p1[1]);
    return 0 <= dist1 && dist1 <= length * length && Math.abs((x - p1[0]) * (p2[1] - p1[1]) + (y - p1[1]) * (p1[0] - p2[0])) * 2 <= length * Math.abs(this.size);
  }
}

function Preset(title, settings, objects, func) {
  this.title = title;
  this.settings = settings;
  this.objects = objects ?? [];
  this.func = func ?? function() {};
  
  this.set = function() {
    
    gameTime = 0;
    dragObj = null;
    if (menuType.includes("ball") || menuType.includes("wall")) gotoMenu("main");
    if (newX1 != null) {
      newX1 = null;
      newY1 = null;
      newX2 = null;
      newY2 = null;
      newA = null;
    }
    balls = [];
    walls = [];
    springs = [];
    
    if (settings.endTime != undefined) {
      endTime = settings.endTime;
    }
    if (settings.speed != undefined) {
      speed = settings.speed;
    }
    if (settings.height != undefined) {
      zoom(settings.height / gameHeight);
    }
    if (settings.G != undefined) {
      G = settings.G;
    }
    if (settings.gx != undefined) {
      gx = settings.gx;
    }
    if (settings.gy != undefined) {
      gy = settings.gy;
    }
    if (settings.bRestCoef != undefined) {
      bRestCoef = settings.bRestCoef;
    }
    if (settings.bSFrictCoef != undefined) {
      bSFrictCoef = settings.bSFrictCoef;
    }
    if (settings.bKFrictCoef != undefined) {
      bKFrictCoef = settings.bKFrictCoef;
    }
    if (settings.windVX != undefined) {
      windVX = settings.windVX;
    }
    if (settings.windVY != undefined) {
      windVY = settings.windVY;
    }
    if (settings.collide != undefined) {
      collide = settings.collide;
    }
    
    if (settings.distInc != undefined) {
      distInc = settings.distInc;
    }
    if (settings.angInc != undefined) {
      angInc = settings.angInc;
    }
    if (settings.density != undefined) {
      density = settings.density;
    }
    if (settings.moiCoef != undefined) {
      moiCoef = settings.moiCoef;
    }
    if (settings.dragCoef0 != undefined) {
      dragCoef0 = settings.dragCoef0;
    }
    if (settings.dragCoef1 != undefined) {
      dragCoef1 = settings.dragCoef1;
    }
    if (settings.dragCoef2 != undefined) {
      dragCoef2 = settings.dragCoef2;
    }
    if (settings.wRestCoef != undefined) {
      wRestCoef = settings.wRestCoef;
    }
    if (settings.wSFrictCoef != undefined) {
      wSFrictCoef = settings.wSFrictCoef;
    }
    if (settings.wKFrictCoef != undefined) {
      wKFrictCoef = settings.wKFrictCoef;
    }
    if (settings.ballMovable != undefined) {
      ballMovable = settings.ballMovable;
    }
    if (settings.ballRotatable != undefined) {
      ballRotatable = settings.ballRotatable;
    }
    if (settings.kCoef != undefined) {
      kCoef = settings.kCoef;
    }
    if (settings.coilRatio != undefined) {
      coilRatio = settings.coilRatio;
    }
    if (settings.thicknessRatio != undefined) {
      thicknessRatio = settings.thicknessRatio;
    }
    
    if (settings.screenX != undefined) {
      screenX = settings.screenX;
    }
    if (settings.screenY != undefined) {
      screenY = settings.screenY;
    }
    if (settings.distOffsetX != undefined) {
      distOffsetX = settings.distOffsetX;
    }
    if (settings.distOffsetY != undefined) {
      distOffsetY = settings.distOffsetY;
    }
    if (objects != undefined) {
      for (o of objects) {
        switch (o.objType) {
          case "ball":
            balls.push(new Ball(o.px, o.py, o.pa, o.vx, o.vy, o.va, o.mass, o.size, o.moiCoef, o.drag0, o.drag1, o.drag2, o.movable, o.rotatable, o.color));
            break;
          case "rectWall":
            walls.push(new RectWall(o.x1, o.y1, o.x2, o.y2, o.size, o.wRest, o.wSFrict, o.wKFrict, o.color));
            break;
          case "triWall":
            walls.push(new TriWall(o.x, o.y, o.wRest, o.wSFrict, o.wKFrict, o.color));
            break;
          case "circleWall":
            walls.push(new CircleWall(o.x, o.y, o.r1, o.r2, o.a1, o.a2, o.wRest, o.wSFrict, o.wKFrict, o.color));
            break;
          case "listWall":
            walls.push(new ListWall(o.wList));
            break;
          case "spring":
            springs.push(new Spring((o.obj1.objType == "point" ? o.obj1 : (o.obj1.objType == "ball" ? balls : walls)[o.obj1.index]), (o.obj2.objType == "point" ? o.obj2 : (o.obj2.objType == "ball" ? balls : walls)[o.obj2.index]), o.dx1, o.dy1, o.dx2, o.dy2, o.equilibrium, o.k, o.size, o.coils, o.thickness, o.color));
            break;
        }
      }

  this.title = title;

  this.hoverFactor = 1.08;

  this.eValue = 0;
  this.eSign = 1;
  
  this.x = () => menu.width / 2;
  this.y = (n) => n * menu.width * 7 / 20 + menu.width * 9 / 40;

    ctxMenu.textAlign = "center";
    ctxMenu.textBaseline = "middle";
    ctxMenu.fillText(this.get(), this.x(), this.y(n));
  }
  
  this.getValue = () => this.clicked ? this.sign * this.value * 10 ** (this.eSign * this.eValue) : this.rawGet();
  
  this.get = () => (title + ": " + (truncate(this.getValue())));
  
  this.updateHover = function(x, y, n) {
    this.hovered = this.x() - this.sx() / 2 <= x && x <= this.x() + this.sx() / 2 && this.y(n) - this.sy() / 2 <= y && y <= this.y(n) + this.sy() / 2;
  }
  
  this.click = function() {
    if (pressedKeys.includes("control")) {
      writeClipboard(this.getValue());
    } else if (this.clickable) {
      this.clicked = true;
      this.value = 0;
      this.digit = 0;
      this.sign = 1;
      this.eMode = false;
      this.eValue = 0;
      this.eSign = 1;
    }
  }
  
  this.updateValue = function(num) {
    if (num == "e") {
      if (this.value == 0) {
        this.value = 1;
      }
      this.eMode = true;
    } else if (this.eMode) {
      if (num == "-") {
        this.eSign *= -1;
      } else if (!isNaN(+num)) {
        this.eValue = this.eValue * 10 + (+num);
      }
    } else if (num == "-") {
        this.sign *= -1;
    } else if (num == "." && this.digit == 0) {
        this.digit = 1;
    } else if (!isNaN(+num)) {
      if (this.digit == 0) {
        this.value = this.value * 10 + (+num);
      } else {
        this.value += num / 10 ** this.digit;
        this.digit += 1;
      }
    }
  }
  
  this.back = function() {
    if (this.eMode) {
      if (this.eValue == 0) {
        this.eMode = false;
        this.eSign = 1;
      } else {
        this.eValue = Math.floor(this.eValue / 10);
      }
    } else {
      if (this.digit == 1) {
        this.digit = 0;
      } else if (this.value == 0) {
        this.sign = 1;
      } else if (this.digit == 0) {
        this.value = Math.floor(this.value / 10);
      } else {
        this.digit -= 1;
        this.value = Math.floor(this.value * 10 ** (this.digit - 1)) / 10 ** (this.digit - 1);
      }
    }
  }
  
  this.esc = function() {
    this.clicked = false;
  }
  
  this.set = function() {
    this.rawSet(this.sign * this.value * 10 ** (this.eSign * this.eValue));
    this.clicked = false;
  }
  
}

function listWallSize(x, y, mx, my) {
  let pn = Math.floor((x.length - 1) * 9 / 10);
  return ((mx - x[pn]) * (y[pn] - y[x.length - 1]) + (my - y[pn]) * (x[x.length - 1] - x[pn])) / dist(x[pn], y[pn], x[x.length - 1], y[x.length - 1]);
}

function getListWall(x, y, size, color) {
  let wList = [];
  let pn = 0;
  let distance;
  
  let n1;
  for (let n = 1; n < x.length; n++) {
    distance = dist(x[0], y[0], x[n], y[n]);
    if (distance >= gameHeight * listWallInc) {
      n1 = n;
      break;
    }
  }
  
  let normalX = (y[0] - y[n1]) / distance;
  let normalY = (x[n1] - x[0]) / distance;
  let pox = x[0] + normalX * size;
  let poy = y[0] + normalY * size;
  
  let ox;
  let oy;
  for (let n = n1; n < x.length; n++) {
    distance = dist(x[pn], y[pn], x[n], y[n]);
    if (distance >= gameHeight * listWallInc || n == x.length - 1) {
      normalX = (y[pn] - y[n]) / distance;
      normalY = (x[n] - x[pn]) / distance;
      ox = (x[pn] + x[n]) / 2 + normalX * size;
      oy = (y[pn] + y[n]) / 2 + normalY * size;
      
      wList.push([[pox, x[pn], ox], [poy, y[pn], oy], wRestCoef, wSFrictCoef, wKFrictCoef, color]);
      wList.push([[x[pn], ox, x[n]], [y[pn], oy, y[n]], wRestCoef, wSFrictCoef, wKFrictCoef, color]);
      
      pn = n;
      pox = ox;
      poy = oy;
    }
  }
  wList.push([[pox, x[pn], x[pn] + normalX * size], [poy, y[pn], y[pn] + normalY * size], wRestCoef, wSFrictCoef, wKFrictCoef, color]);
  return new ListWall(getWalls(wList));
}

function parametricWall(x, y, t0, t1, dt, size, color) {
  let xl = [];
  let yl = [];
  for (let t = t0; t <= t1; t += dt) {
      xl.push(x(t));
      yl.push(y(t));
  }
  return getListWall(xl, yl, size, color);
}

function getWalls(l) {
    let wList = [];
    for (w of l) {
        wList.push(new TriWall(...w));
    }
    return wList;
}

function createBall() {
  let newSize = 2 * alignNum(dist(newX1, newY1, mouseX, mouseY));
  balls.push(new Ball(newX1, newY1, alignAngle(angle(newX1, newY1, mouseX, mouseY)), 0, 0, 0, density * newSize ** 3, newSize, moiCoef, dragCoef0, dragCoef1, dragCoef2, ballMovable, ballRotatable, newColor));
  
  newX1 = null;
  newY1 = null;
}

function createRectWall() {
  let size = alignNum(((mouseX - newX1) * (newY1 - newY2) + (mouseY - newY1) * (newX2 - newX1)) / dist(newX1, newY1, newX2, newY2));
  walls.push(new RectWall(newX1, newY1, newX2, newY2, size, wRestCoef, wSFrictCoef, wKFrictCoef, newColor));
  
  newX1 = null;
  newY1 = null;
  newX2 = null;
  newY2 = null;
  newA = null;
}

function createTriWall() {
  let aligned = alignLine(newX2, newY2, mouseX, mouseY);
  walls.push(new TriWall([newX1, newX2, aligned[0]], [newY1, newY2, aligned[1]], wRestCoef, wSFrictCoef, wKFrictCoef, newColor));
  
  newX1 = null;
  newY1 = null;
  newX2 = null;
  newY2 = null;
  newA = null;
}

function createCircleWall() {
    let r1 = alignNum(dist(newX1, newY1, newX2, newY2));
    let r2 = alignNum(dist(newX1, newY1, mouseX, mouseY));
    if (Math.abs(r2 - r1) < minDrag / scaleFactor) {
        r2 = 0;
    }
    let a1 = angle(newX1, newY1, newX2, newY2);
    let a2 = alignAngle(a1 + newA);
    if (Math.abs(a2 - a1) * (r1 + r2) / 2 < minDrag / scaleFactor || Math.abs(a2 - a1) >= Math.PI * 2) {
        a2 = a1 + (a2 - a1 >= 0 ? 1 : -1) * Math.PI * 2;
    }
    walls.push(new CircleWall(newX1, newY1, Math.min(r1, r2), Math.max(r1, r2), a1, a2, wRestCoef, wSFrictCoef, wKFrictCoef, newColor));
    newX1 = null;
    newY1 = null;
    newX2 = null;
    newY2 = null;
    newA = null;
}

function createListWall() {
  walls.push(getListWall(newX1, newY1, alignNum(listWallSize(newX1, newY1, mouseX, mouseY)), newColor));
  
  newX1 = null;
  newY1 = null;
  newX2 = null;
  newY2 = null;
}

function createSpring() {
  let a1 = newObj1.getA();
  let ax1 = Math.cos(a1);
  let ay1 = Math.sin(a1);
  let x1 = newObj1.getX() + newX1 * ax1 - newY1 * ay1;
  let y1 = newObj1.getY() + newX1 * ay1 + newY1 * ax1;
  let a2 = newObj2.getA();
  let ax2 = Math.cos(a2);
  let ay2 = Math.sin(a2);
  let x2 = newObj2.getX() + newX2 * ax2 - newY2 * ay2;
  let y2 = newObj2.getY() + newX2 * ay2 + newY2 * ax2;
  let length = dist(x1, y1, x2, y2);
  let size = 2 * alignNum(((mouseX - x2) * (y2 - y1) - (mouseY - y2) * (x2 - x1)) / length);
  if (Math.abs(size) * scaleFactor >= minDrag) {
    springs.push(new Spring(newObj1, newObj2, newX1, newY1, newX2, newY2, length, kCoef * Math.abs(size) ** 3 / length, size, Math.ceil(Math.abs(coilRatio * length / size)), Math.abs(thicknessRatio * size), newColor));
    newObj1 = null;
    newX1 = null;
    newY1 = null;
    newObj2 = null;
    newX2 = null;
    newY2 = null;
  }
}

function drag(mode) {
    if (dragObj.objType == "ball") {
      if (mode) {
        if (dragMode == true) {
            dragOffsetX = dragObj.px - mouseX;
            dragOffsetY = dragObj.py - mouseY;
            dragvx = [];
            dragvy = [];
        } else if (dragMode == false) {
            dragOffsetA = dragObj.pa - angle(dragObj.px, dragObj.py, mouseX, mouseY);
            dragva = [];
        }
      } else {
        if (dragMode == true) {
          dragObj.px = alignX(mouseX + dragOffsetX);
          dragObj.py = alignY(mouseY + dragOffsetY);
          dragObj.vx = (dragvx.length == 0 ? 0 : average(dragvx)) / rawMaindt / speed;
          dragObj.vy = (dragvy.length == 0 ? 0 : average(dragvy)) / rawMaindt / speed;
        } else if (dragMode == false) {
          dragObj.pa = alignAngle(angle(b.px, b.py, mouseX, mouseY) + dragOffsetA);
          dragObj.va = (dragva.length == 0 ? 0 : average(dragva)) / rawMaindt / speed;
        }
      }
    } else {
      if (mode) {
        if (dragMode == true) {
          dragOffsetX = dragObj.centerX - mouseX;
          dragOffsetY = dragObj.centerY - mouseY;
        } else if (dragMode == false) {
          dragOffsetA = dragObj.angle - angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY);
        }
      } else {
        if (dragMode == true) {
          dragObj.move(alignX(mouseX + dragOffsetX) - dragObj.centerX, alignY(mouseY + dragOffsetY) - dragObj.centerY);
        } else if (dragMode == false) {
          dragObj.rotate(alignAngle(angle(dragObj.centerX, dragObj.centerY, mouseX, mouseY) + dragOffsetA) - dragObj.angle);
        }
      }
    }
}

function checkClick() {
  if (selectMenuObj) return true;
  if (dragObj == null) {
    if (newX1 == null && newObj1 == null) return true;
    if (pClickX != null && pClickY != null && dist(pClickX, pClickY, mouseX, mouseY) < minDrag / scaleFactor && !(dragType == "k" && ((newObj1 != null && newX1 == null) || (newObj2 != null && newX2 == null)))) return false;
    let ret = newX1 == null && newObj1 == null;
    let aligned;
    switch (dragType) {
      case "b":
        createBall();
        break;
      case "w":
        if (newX2 != null) {
          createRectWall();
        } else if (newX1 != null) {
          aligned = alignLine(newX1, newY1, mouseX, mouseY);
          newX2 = aligned[0];
          newY2 = aligned[1];
          newA = 0;
        }
        break;
      case "t":
        if (newX2 != null) {
          createTriWall();
        } else if (newX1 != null) {
          aligned = alignLine(newX1, newY1, mouseX, mouseY);
          newX2 = aligned[0];
          newY2 = aligned[1];
          newA = 0;
        }
        break;
      case "c":
        if (newX2 != null) {
          createCircleWall();
        } else if (newX1 != null) {
          aligned = alignDist(newX1, newY1, mouseX, mouseY);
          newX2 = aligned[0];
          newY2 = aligned[1];
          newA = 0;
        }
        break;
      case "l":
        if (newX2 != null) {
          createListWall();
        } else if (newX1 != null) {
          if (newX1.length >= 2) {
            newX2 = true;
            newY2 = true;
          }
        }
        break;
      case "k":
        if (newX2 != null) {
          createSpring();
        } else if (newObj2 != null) {
          let p;
          switch (newObj2.objType) {
            case "ball":
              p = alignDist(0, 0, mouseX - newObj2.px, mouseY - newObj2.py, align=true, a2=newObj2.pa, revert=false);
              newX2 = p[0];
              newY2 = p[1];
              break;
            case "rectWall":
            case "triWall":
            case "listWall":
              p = alignLine(0, 0, mouseX - newObj2.centerX, mouseY - newObj2.centerY, align=true, ax=Math.cos(newObj2.angle), ay=Math.sin(newObj2.angle), revert=false);
              newX2 = p[0];
              newY2 = p[1];
              break;
            case "circleWall":
              p = alignDist(0, 0, mouseX - newObj2.centerX, mouseY - newObj2.centerY, align=true, a2=newObj2.angle, revert=false);
              newX2 = p[0];
              newY2 = p[1];
              break;
          }
        } else if (newX1 != null) {
          let search = true;
          if (!pressedKeys.includes("control")) {
            for (b of balls.toReversed()) {
                if (b.containsPoint(mouseX, mouseY)) {
                  newObj2 = b;
                  search = false;
                  break;
                }
            }
            
            if (search) {
                for (w of walls.toReversed()) {
                    if (w.containsPoint(mouseX, mouseY)) {
                      newObj2 = w;
                      search = false;
                      break;
                    }
                }
            }
          }
          
          if (search) {
            newObj2 = new Point(...alignPos(mouseX, mouseY));
            newX2 = 0;
            newY2 = 0;
          }
        } else if (newObj1 != null) {
          let p;
          switch (newObj1.objType) {
            case "ball":
              p = alignDist(0, 0, mouseX - newObj1.px, mouseY - newObj1.py, align=true, a1=newObj1.pa, revert=false);
              newX1 = p[0];
              newY1 = p[1];
              break;
            case "rectWall":
            case "triWall":
            case "listWall":
              p = alignLine(0, 0, mouseX - newObj1.centerX, mouseY - newObj1.centerY, align=true, ax=Math.cos(newObj1.angle), ay=Math.sin(newObj1.angle), revert=false);
              newX1 = p[0];
              newY1 = p[1];
              break;
            case "circleWall":
              p = alignDist(0, 0, mouseX - newObj1.centerX, mouseY - newObj1.centerY, align=true, a1=newObj1.angle, revert=false);
              newX1 = p[0];
              newY1 = p[1];
              break;
          }
        }
        break;
    }
    return ret;
  } else {
    drag();
    dragObj = null;
    gotoMenu("main");
    return false;
  }
}

function updateMenuObjHover() {
  if (dragObj != null) {
    if (menuBallShown()) {
      menuObjHovered = sqdist(menu.width / 2, menu.width * 2 / 5, clientX - main.width, clientY + document.getElementById("scroll").scrollTop) <= (menu.width * 3 / 10 * (menuObjHovered ? 1.08 : 1)) ** 2;
    } else if (menuWallShown() || menuSpringShown()) {
      let sizeScale = dragObj.offsetSize / menu.width / 3 * 5 / (menuObjHovered ? 1.08 : 1);
      menuObjHovered = dragObj.containsPoint((clientX - main.width - menu.width / 2) * sizeScale + dragObj.getX() + dragObj.offsetX, (menu.width * 2 / 5 - clientY - document.getElementById("scroll").scrollTop) * sizeScale + dragObj.getY() + dragObj.offsetY);
    }
  }
}

function deleteDragObj() {
  if (dragObj != null) {
      if (dragObj.objType == "ball") {
          balls.splice(balls.indexOf(dragObj), 1);
      } else if (dragObj.objType == "spring") {
          springs.splice(springs.indexOf(dragObj), 1);
      } else {
          walls.splice(walls.indexOf(dragObj), 1);
      }
      dragObj = null;
      gotoMenu("main");
  }
  newX1 = null;
  newY1 = null;
  newX2 = null;
  newY2 = null;
  newA = null;
  newObj1 = null;
  newObj2 = null;
}

function togglePause() {
  paused = !paused;
}

function doUpdate() {
  let dt = speed / fps / upf;
  if (dt > 0 && dt < 2 * speed / fps) {
    for (let n = 0; n < upf; n++) {
      update(dt, false);
    }
  }
}
